<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris & Henry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：一屏。几层画布叠成会流动的星月夜，文字居中叠在天空上。 */
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--sky); color: var(--fg); -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root {
  color-scheme: dark;
  --sky: #0d1b4b;            /* 普鲁士蓝夜空 */
  --sky-deep: #070d26;       /* 山丘与阴影 */
  --fg: #fdf6d8;             /* 月光白 */
  --muted: #b9c8ee;          /* 淡钴蓝 */
  --gold: #ffd95a;           /* 星与月 */
  --amber: #f6a623;
  --chip: rgba(7, 13, 38, .55); --line: rgba(255, 217, 90, .35);
  --font-num: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
  --font-zh: "Noto Serif SC", "Songti SC", "PingFang SC", serif;
}
main {
  position: fixed; inset: 0; overflow-y: auto; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(17vh + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  max-width: 100%; text-align: center;
  text-shadow: 0 1px 14px rgba(5, 10, 34, .95), 0 0 3px rgba(5, 10, 34, .8);
  animation: rise 1.1s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

h1 {
  margin: 0; font-family: var(--font-num); font-style: italic; font-weight: 500;
  font-size: clamp(34px, 10vw, 54px); line-height: 1.05; letter-spacing: .01em; color: var(--fg);
}
h1 em { font-style: italic; color: var(--gold); padding: 0 .12em; }
.lead, .unit { font-size: clamp(15px, 4.2vw, 19px); letter-spacing: .5em; text-indent: .5em; color: var(--muted); }
.core {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: min(86vw, 46vh, 440px); aspect-ratio: 1; margin-block: -6px;
  background: radial-gradient(closest-side, rgba(7, 13, 38, .72), rgba(7, 13, 38, .4) 55%, transparent);
}
.num {
  --n: 2;
  display: flex; justify-content: center;
  font-family: var(--font-num); font-weight: 300; line-height: .95;
  font-size: min(clamp(120px, 42vw, 250px), calc(78vw / (var(--n) * .5)));
  font-variant-numeric: lining-nums tabular-nums;
  background: linear-gradient(180deg, #fffbe6 15%, var(--gold) 60%, var(--amber));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: none; filter: drop-shadow(0 0 26px rgba(255, 205, 80, .55));
}
.since { font-size: clamp(13px, 3.6vw, 16px); color: var(--muted); letter-spacing: .08em; }
.live { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 10px; font-size: clamp(15px, 4.2vw, 19px); }
.clock { font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 1.25em; color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; text-shadow: none; }
.chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; background: var(--chip); border: 1px solid var(--line); }
.chip b { font-weight: 600; color: var(--gold); }

@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
/* 质感全部画在 #finish 画布上（普通半透明层）；#grain 不再需要，整页没有混合模式层 */
#grain { display: none; }
/* 互动层的触摸约定：连点不触发双击放大，长按、拖动不选中文字；
   一屏放得下时（Fx 给 <html> 加 .fx-still）拖动整个交给页面，星尘才能一路跟着手指 */
main { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.fx-still main { touch-action: none; }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="lights" aria-hidden="true"></canvas>
<canvas id="land" aria-hidden="true"></canvas>
<canvas id="finish" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<main>
  <section class="card">
    <h1 id="names"></h1>
    <div class="lead">在一起的第</div>
    <div class="core" id="core">
      <div class="num" id="days"></div>
      <div class="unit">天</div>
    </div>
    <div class="since" id="since"></div>
    <div class="live"><span id="ymd"></span><span class="clock" id="clock" aria-hidden="true"></span></div>
    <div class="chips" id="chips"></div>
  </section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>

/* ═════ 只需要改这里 ═════ */
const CONFIG = {
  names: ['Paris', 'Henry'],
  start: [2026, 11, 1]           // 在一起的那天（算作第 1 天）：年, 月, 日
};

/* ── 公共：场景状态，各图层共用 ── */
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.random() * (b - a);
/* 可复现的随机数：同一个 seed 每次给出同一串数，窗口大小变化时画面不会重新洗牌 */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const Scene = {
  W: 0, H: 0, U: 0, dpr: 1,          // 视口宽高、短边、像素比（上限 2）
  t: 0,                              // 当前帧时间 ms
  age: 0,                            // 开场至今 ms（入场动画用；减弱动效时为 Infinity）
  day: 0, milestone: '',             // 今天是第几天；今天若是纪念日则是它的名字（由 UI 填写）
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
  quality: 1,                        // 1 = 全效果；帧率跟不上时 core 会逐步降到 .4
  core: { x: 0, y: 0, r: 0 },        // 大数字的中心与半径（主旋涡）
  box: { left: 0, top: 0, right: 0, bottom: 0 },   // 文字区域的外框
  horizon: 0,                        // 山脊线的大致高度 y
  stars: [], moon: null,             // 由 Lights.compose 填写
  pointer: { x: 0, y: 0, active: false },
  _h: {},
  on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); },
  emit(ev, d) { (this._h[ev] || []).forEach(f => f(d)); }
};

/* ── 文字：日期计算、计时、入场 ── */
const UI = (() => {
  /* ── 日期 ── */
  const [SY, SM, SD] = CONFIG.start, DAY = 86400000;
  const startUTC = Date.UTC(SY, SM - 1, SD);
  const todayUTC = n => Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  const dayNo = n => Math.round((todayUTC(n) - startUTC) / DAY) + 1;
  function elapsed(now) {
    let y = now.getFullYear() - SY, m = now.getMonth() + 1 - SM, d = now.getDate() - SD;
    if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    return [y && y + ' 年', m && m + ' 个月', d + ' 天'].filter(Boolean).join(' ');
  }
  const SPECIAL = { 100: '百日', 520: '我爱你', 1314: '一生一世', 3344: '生生世世', 5200: '我爱你', 9999: '长长久久' };
  function nextMilestone(n) {
    const c = [30, 50, ...Object.keys(SPECIAL).map(Number), (Math.floor(n / 100) + 1) * 100];
    return Math.min(...c.filter(x => x > n));
  }
  function nextAnniversary(now) {
    let y = now.getFullYear();
    if (Date.UTC(y, SM - 1, SD) <= todayUTC(now)) y++;
    return { years: y - SY, left: Math.round((Date.UTC(y, SM - 1, SD) - todayUTC(now)) / DAY) };
  }
  const pad = n => String(n).padStart(2, '0');
  let shown = -1, counting = false;
  function showNum(n) { const s = String(n); $('days').textContent = s; $('days').style.setProperty('--n', Math.max(2, s.length)); }
  function tick() {
    const now = new Date(), n = dayNo(now);
    if (n !== shown) {
      shown = n;
    const an0 = now.getMonth() + 1 === SM && now.getDate() === SD && now.getFullYear() > SY;
    Scene.day = n; Scene.milestone = an0 ? (now.getFullYear() - SY) + ' 周年' : SPECIAL[n] || (n % 100 === 0 ? '第 ' + n + ' 天' : '');
      if (!counting) showNum(n);
      $('ymd').textContent = '已经相伴 ' + elapsed(now);
      const ms = nextMilestone(n), an = nextAnniversary(now);
      $('chips').innerHTML =
        `<span class="chip">第 <b>${ms}</b> 天${SPECIAL[ms] ? ' · ' + SPECIAL[ms] : ''} · 还有 ${ms - n} 天</span>` +
        `<span class="chip"><b>${an.years}</b> 周年 · 还有 ${an.left} 天</span>`;
    }
    $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  function countUp() {
    if (Scene.reduced) return;
    counting = true;
    const t0 = performance.now(), dur = 1800;
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      showNum(Math.round(shown * e));
      if (p < 1) requestAnimationFrame(step); else counting = false;
    })(t0);
  }
  let started = false;
  function init() {
    if (started) return; started = true;
    $('names').innerHTML = `${CONFIG.names[0]}<em>&amp;</em>${CONFIG.names[1]}`;
    $('since').textContent = `起始日 ${SY}-${SM}-${SD} 星期${'日一二三四五六'[new Date(SY, SM - 1, SD).getDay()]}`;
    tick(); countUp();
    setInterval(tick, 1000);
  }
  /* 告诉其他图层：数字在哪、文字占了哪块 */
  function measure() {
    const c = $('core').getBoundingClientRect(), b = document.querySelector('.card').getBoundingClientRect();
    return {
      core: { x: c.left + c.width / 2, y: c.top + c.height / 2, r: c.width / 2 },
      box: { left: b.left, top: b.top, right: b.right, bottom: b.bottom }
    };
  }
  return { init, measure };
})();

/* ── 星与月：柔和发光、带笔触的油画光晕，画在 #lights 上 ──
   每个光源在布局时画成一张小贴图（柔光 + 沿圆周的软笔触 + 厚涂的亮核），
   每帧只做贴图合成：缓慢呼吸、各自闪烁、光晕随天空的旋涡慢慢转动。 */
const Lights = (() => {
  const TAU = Math.PI * 2;
  /* 由星核向外的七层颜色：奶白 → 柠檬黄 → 铬黄 → 橙 → 淡绿 → 青白 → 蓝白 */
  const PAL = {
    gold:  ['#fffbe6', '#ffee9a', '#ffd43f', '#f7a521', '#dbe7a0', '#a9d9cc', '#cfe3f5'],
    lemon: ['#fffde9', '#fff4ac', '#f6e15e', '#e8bd3c', '#cfe6ac', '#a4dccf', '#d3e8f6'],
    amber: ['#fff6d2', '#ffe07a', '#ffbf2e', '#f08a1a', '#dedb90', '#a2d2c2', '#c6dcf2'],
    white: ['#ffffff', '#fdfce8', '#f3f1b8', '#e9d47c', '#d2ebd8', '#b7e0e8', '#deecfb'],
    moon:  ['#fff8d6', '#ffee96', '#ffd640', '#f6a01c', '#e0e89c', '#aadbc8', '#cfe4f4']
  };
  const CRESCENT = ['#ffb52e', '#ffc648', '#ffd76a', '#f79a1e', '#ec8213', '#ffb52e'];
  /* 星位：[区, u, v, 大小, 性格]。T 顶部条带，L / R 左右留白（u 从屏幕边向文字方向数），B 文字与山之间。
     按先后取用，放不下（挡字、太挤、被柏树遮住）的自动跳过，所以同一张表适用于各种屏幕。 */
  const SLOTS = [
    ['T', .11, .52, 1.15, 'gold'],
    ['L', .85, .62, 1.3, 'white'],      // 宽屏：柏树右侧低处的"长庚星"
    ['L', .60, .43, 1.3, 'white'],      // 窄屏：改到柏树梢上方
    ['R', .30, .36, 1.0, 'gold'],
    ['R', .82, .44, .9, 'gold'],
    ['R', .10, .62, .7, 'lemon'],
    ['L', .78, .20, .6, 'lemon'],
    ['T', .40, .30, .6, 'lemon'],
    ['R', .30, .80, .9, 'amber'],
    ['T', .585, .66, .8, 'gold'],
    ['L', .20, .34, .8, 'amber'],
    ['R', .55, .70, 1.1, 'gold'],
    ['B', .72, .5, .6, 'amber'],
    ['R', .25, .50, .7, 'gold'],
    ['L', .55, .33, .95, 'gold'],
    ['R', .93, .10, .55, 'lemon'],
    ['L', .92, .84, .55, 'amber'],
    ['R', .88, .86, .5, 'lemon']
  ];
  let S, ctx, plan = [], lights = [], cache = new Map(), flare, clock = 0;

  const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  /* 决定星星和月亮摆在哪（其他图层会读 scene.stars / scene.moon） */
  function compose(scene) {
    const { W, H, U, box, core, horizon } = scene, rand = rng(11);
    // 文字是居中的：外框太宽时，两侧各留 12% 当作可用的边
    const keep = { l: Math.max(box.left, W * .12), r: Math.min(box.right, W * .88), t: box.top, b: box.bottom };
    const gap = (x, y) => Math.hypot(Math.max(keep.l - x, 0, x - keep.r), Math.max(keep.t - y, 0, y - keep.b));
    // 月亮：右上；挡到文字就往角上挪
    const mr = U * .078, moon = { x: W - Math.max(mr * 2.2, W * .17), y: Math.max(mr * 1.85, H * .1), r: mr, halo: mr * 3.1 };
    for (let i = 0, x0 = moon.x, y0 = moon.y; i <= 20 && gap(moon.x, moon.y) < mr * 1.12; i++) {
      moon.x = x0 + (W - mr * 1.25 - x0) * i / 20; moon.y = y0 + (mr * 1.3 - y0) * i / 20;
    }
    const unit = 8.8 * Math.pow(U / 400, .85), cypress = Math.max(W * .24, 90);
    const want = Math.round(Math.min(16, Math.max(9, 5 + Math.sqrt(W * H) / 110)));
    const bandH = Math.max(keep.t, U * .2), stars = [];
    plan = [];
    SLOTS.forEach(([zone, u, v, k, kind], id) => {
      const seed = rand() * 6.3;                               // 每个星位都取一次随机数，星星增减时其余的不变
      if (stars.length >= want || (kind === 'white' && plan.some(p => p.kind === 'white'))) return;
      const r = unit * k, halo = r * (kind === 'white' ? 5 : 4.6), pad = r * 1.7 + 3, edge = r * 1.6 + 2;
      let x, y, clear = true;
      if (zone === 'T') { x = u * W; y = v * bandH; clear = gap(x, y) >= pad; }
      else if (zone === 'B') { x = keep.l + u * (keep.r - keep.l); y = (keep.b + pad + H * .8 - halo * .5) / 2; clear = gap(x, y) >= pad; }
      else {                                                   // 留白太窄时贴着屏幕边，露出半个光晕
        const xin = edge + u * Math.max(0, (zone === 'L' ? keep.l : W - keep.r) - pad - edge);
        x = zone === 'L' ? xin : W - xin; y = v * horizon;
      }
      const ok = clear && y - r * 1.5 >= 2 && y + halo * .5 <= H * .8                          // 不出天空
        && Math.hypot(x - core.x, y - core.y) >= core.r + r * 1.5                              // 不进大数字的旋涡眼
        && !(x - r < cypress && y + r > H * .42)                                               // 不躲到柏树后面
        && Math.hypot(x - moon.x, y - moon.y) >= moon.halo * .72 + halo * .7
        && stars.every(s => Math.hypot(x - s.x, y - s.y) >= (halo + s.halo) * .8);
      if (!ok) return;
      stars.push({ x, y, r, halo, seed }); plan.push({ kind, id });
    });
    scene.stars = stars; scene.moon = moon;
  }

  /* ── 画贴图用的几种"笔" ── */
  /* 一团柔光：中心实、向外化开 */
  function blob(c, x, y, rad, col, a) {
    const g = c.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(.35, rgba(col, a * .78)); g.addColorStop(.68, rgba(col, a * .28)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fill();
  }
  /* 一笔软边的色块：把柔光沿笔触方向拉长 */
  function dab(c, x, y, len, wid, ang, col, a) {
    c.save(); c.translate(x, y); c.rotate(ang); c.scale(1, wid / len); blob(c, 0, 0, len, col, a); c.restore();
  }
  /* 几团略微错开的柔光叠在一起：轮廓不是正圆 */
  function lump(c, rand, n, off, rad, col, a) {
    for (let i = 0; i < n; i++) { const t = rand() * TAU, d = off * rand(); blob(c, Math.cos(t) * d, Math.sin(t) * d, rad * (.88 + .24 * rand()), col, a); }
  }
  /* 绕着光源一圈圈的软笔触，颜色随半径从暖到冷 */
  function swirl(c, rand, p, from, to, halo, size, turn) {
    for (let q = from; q < to; q += .1 + .03 * rand()) {
      const n = Math.max(4, Math.round(TAU * q * halo / (size * 4.6))), a0 = rand() * TAU;
      for (let i = 0; i < n; i++) {
        if (rand() < .14) continue;                             // 留些空隙
        const t = a0 + (i + rand() * .6) / n * TAU, rho = q * halo * (1 + .1 * (rand() - .5));
        const band = Math.min(5, Math.floor(1 + q * 5.4 + rand() * 1.3)), col = p[band];
        const len = Math.min(rho * .5, size * (1.1 + .9 * rand())), wid = size * (.28 + .16 * rand());
        dab(c, Math.cos(t) * rho, Math.sin(t) * rho, len, wid, t + Math.PI / 2 + turn, col, (.62 - .5 * q) * (.55 + .5 * rand()));
      }
    }
  }
  function sprite(half, paint) {
    const cv = document.createElement('canvas'), px = Math.ceil(half * S.dpr);
    cv.width = cv.height = px * 2;
    const c = cv.getContext('2d'); c.setTransform(S.dpr, 0, 0, S.dpr, px, px);
    paint(c);
    return { cv, half: px / S.dpr };
  }

  /* 一颗星：冷色薄纱 → 暖色光 → 一圈圈软笔触 → 厚涂的亮核 */
  function paintStar(c, L, rand) {
    const { r, halo } = L, p = PAL[L.kind], white = L.kind === 'white';
    c.rotate(rand() * TAU); c.scale(1, .9 + .1 * rand());      // 每颗星略扁一点、朝向不同
    lump(c, rand, 4, halo * .1, halo * .92, p[6], .13);
    lump(c, rand, 3, halo * .1, halo * .78, p[5], .16);
    lump(c, rand, 3, halo * .08, halo * .62, p[4], .22);
    lump(c, rand, 2, halo * .05, halo * .47, p[3], white ? .1 : .22);
    lump(c, rand, 2, halo * .04, halo * .4, p[2], .5);
    blob(c, 0, 0, halo * .3, p[1], .7);
    swirl(c, rand, p, .27, .93, halo, r, L.spin * .16);
    // 亮核：几笔叠出来的一小块厚颜料
    blob(c, 0, 0, r * 1.8, p[1], .6);
    for (let i = 0; i < 5; i++) { const t = rand() * TAU; dab(c, Math.cos(t) * r * .35, Math.sin(t) * r * .35, r * .85, r * .6, rand() * TAU, p[0], .8); }
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r * 1.08);
    g.addColorStop(0, p[0]); g.addColorStop(.62, p[0]); g.addColorStop(1, rgba(p[0], 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.08, 0, TAU); c.fill();
    blob(c, -r * .15, -r * .2, r * .55, '#ffffff', .9);
  }

  /* 月晕：天上最大、最浓的一团光（不含月牙，方便单独转动） */
  function paintMoonHalo(c, L, rand) {
    const { r, halo } = L, p = PAL.moon;
    lump(c, rand, 5, halo * .06, halo * .95, p[6], .14);
    lump(c, rand, 4, halo * .06, halo * .82, p[5], .18);

      g.addColorStop(0, css(mix(c, hi, .1), al)); g.addColorStop(.5, css(c, al)); g.addColorStop(1, css(c, al * rand() * .6));
      a.strokeStyle = g;
      a.beginPath(); a.moveTo(x0, t * .8); a.quadraticCurveTo(LEN / 2, t * .8 + bend * 2, x1, t * .8 + (rand() - .5) * .08); a.stroke();
    }
    a.lineWidth = .09;
    for (let i = 0; i < 2; i++) {             // 上缘两小段高光，下缘一道暗边
      const x0 = .5 + rand() * 1.6, y = -.36 + i * .12 + bend * .5;
      a.strokeStyle = css(mix(col, hi, .5), .7);
      a.beginPath(); a.moveTo(x0, y); a.lineTo(x0 + .6 + rand() * 1.2, y + bend * .3); a.stroke();
    }
    a.strokeStyle = css(mix(col, DARK, .55), .5);

  }
  function makeAtlas() {
    const k = u * S.dpr, rand = rng(5);
    cw = Math.ceil((LEN + 2 * PAD) * k); ch = Math.ceil((1 + 2 * PAD) * k);
    atlas = document.createElement('canvas'); atlas.width = cw * VAR; atlas.height = ch * COLORS.length;
    const a = atlas.getContext('2d');
    COLORS.forEach((col, row) => {
      for (let i = 0; i < VAR; i++) { a.setTransform(k, 0, 0, k, i * cw + PAD * k, row * ch + ch / 2); drawDab(a, col, rand); }

  }
  /* 把一笔贴到画布 c 上：(x, y) 是笔触中心，(co, si) 是方向。亮边永远朝向左上方的光 */
  function put(c, x, y, co, si, sx, sy, row, vr) {
    const f = co - si > 0 ? sy : -sy, k = S.dpr;

  /* 底层：先铺一遍大而深的底色笔触；再顺着流线一笔接一笔排短笔触，排与排挨着走而不相压，缝里露出底色 */
  function prepaint() {
    const { W, dpr } = S, rand = rng(21), list = [];
    base = document.createElement('canvas'); base.width = Math.round(W * dpr); base.height = Math.ceil(top * dpr);
    const b = base.getContext('2d'), g = b.createLinearGradient(0, 0, 0, base.height);
    g.addColorStop(0, '#081030'); g.addColorStop(.7, '#0e1d54'); g.addColorStop(1, '#16307a');
    b.fillStyle = g; b.fillRect(0, 0, base.width, base.height);
    const add = (x, y, scale, lift) => {
      const row = pick(x, y, rand, lift, scale > 1.5), m = Math.hypot(fvx, fvy) || 1, k = reach();
      return { x, y, co: fvx / m, si: fvy / m, sx: scale * (.8 + rand() * .45) * k, sy: scale * (.85 + rand() * .3) * Math.sqrt(k), row, vr: Math.floor(rand() * VAR), key: fv + rand() * .2 };
    };
    for (let y = 0; y < top + 2 * u; y += 1.5 * u)
      for (let x = 0; x < W + 4 * u; x += 5 * u) { const d = add(x + (rand() - .5) * 4 * u, y + (rand() - .5) * 2 * u, 1.9, -.16); d.key -= 9; list.push(d); }

    const cell = .8 * u, gw = Math.ceil(W / cell) + 8, gh = Math.ceil(top / cell) + 8, occ = new Uint16Array(gw * gh);
    const at = (x, y) => { const i = Math.floor(x / cell) + 4, j = Math.floor(y / cell) + 4; return i < 0 || j < 0 || i >= gw || j >= gh ? -1 : j * gw + i; };
    const seeds = [];
    for (let j = 0; j < gh; j += 2) for (let i = 0; i < gw; i += 2) seeds.push(j * gw + i);
    for (let i = seeds.length; i > 1;) { const j = Math.floor(rand() * i--), t = seeds[i]; seeds[i] = seeds[j]; seeds[j] = t; }
    let id = 0;
    for (const s of seeds) {
      if (occ[s]) continue;
      let px = (s % gw - 3.5) * cell, py = (Math.floor(s / gw) - 3.5) * cell;
      const lift = (rand() - .5) * .12; id = id % 65535 + 1;
      for (let n = 3 + Math.floor(rand() * 7); n--;) {
        const d = add(px, py, 1, lift), h = d.sx * LEN * u / 2;
        let free = true;
        for (let e = -1; e <= 1; e++) { const c = at(px + d.co * h * e, py + d.si * h * e); if (c < 0 || (occ[c] && occ[c] !== id)) free = false; }
        if (!free) break;
        for (let e = -h; e <= h; e += cell * .7)
          for (let o = -1; o <= 1; o++) { const c = at(px + d.co * e - d.si * o * .5 * u, py + d.si * e + d.co * o * .5 * u); if (c >= 0) occ[c] = id; }
        list.push(d);
        flow(px + d.co * h, py + d.si * h);
        const m = Math.hypot(fvx, fvy) || 1, step = h * (1.1 + rand() * .2);
        px += d.co * h + fvx / m * step; py += d.si * h + fvy / m * step;
      }
    }
    list.sort((p, q) => p.key - q.key);
    for (const d of list) put(b, d.x, d.y, d.co, d.si, d.sx, d.sy, d.row, d.vr);
  }

  /* 上层：会动的笔触。生在画面内（上风处多留一截），活几秒后淡出，再到别处重生 */
  function spawn(d, rand) {
    const m = 16 * u;
    d.x = -m + rand() * (S.W + m * 1.2); d.y = -m * .3 + rand() * (top + m * .6);
    d.row = pick(d.x, d.y, rand, .05); d.vr = Math.floor(rand() * VAR);
    const k = reach();
    d.sx = (.85 + rand() * .45) * k; d.sy = (.9 + rand() * .3) * Math.sqrt(k);
    d.life = 7000 + rand() * 5000; d.age = 0;

  }
  function steer(d) {
    flow(d.x, d.y);
    for (const s of stirs) {                  // 点一下：附近的颜料跟着打个小旋
      const ex = d.x - s.x, ey = d.y - s.y, r = 9 * u, k = s.k * Math.exp(-(ex * ex + ey * ey) / (2 * r * r)) / r;

  }

  function init(scene) {
    S = scene; ctx = $('sky').getContext('2d', { alpha: false });
    const { W, H, U, core, moon, stars } = S;
    u = Math.max(4.6, Math.min(10, Math.sqrt(W * H) * .0095));
    top = H * .93;                            // 再往下被山丘完全挡住，不必画
    speed = u * .0024;                        // px/ms：约每秒两三个笔宽
    const eye = (x, y, r, p, halo) => ({ x, y, r2: r * r, g: p * r * 1.65, halo: halo || 0 });   // p = 旋涡最快处是风速的几倍，正为顺时针
    const room = W - core.x - core.r * 1.3, side = Math.min(U * .16, room * .3);

    ];

    const lit = (o, p) => { flow(o.x, o.y); return eye(o.x, o.y, o.halo * .45, p * Math.max(1, Math.hypot(fvx, fvy)), o.halo); };

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#070d26'; ctx.fillRect(0, 0, W * S.dpr, H * S.dpr);

    if (bound) return; bound = true;

/* ── 收尾：让整幅画像一件实物——亚麻布上的油彩，暖光下的一张照片 ──
   所有东西都在 init 里一次画进 #finish（普通半透明，不用混合模式），frame 什么都不做：
   1. 布纹与颜料起伏：一小块可平铺的浮雕纹理，铺满全屏；再按低频噪声擦淡一部分，看不出重复
   2. 光场：四角与边缘缓缓变暗，文字背后略沉，平涂处带一点深浅云斑 */
const Finish = (() => {
  const SHADE = [3, 7, 22], GLINT = [255, 240, 206];        // 暗处：深普蓝；亮处：清漆上的暖白反光
  const smooth = t => t * t * (3 - 2 * t);
  const step = (a, b, x) => smooth(Math.min(1, Math.max(0, (x - a) / (b - a))));
  let tile = null, tileDpr = 0;

  /* 值噪声；格点按 n 取模，所以每 n 格无缝循环一次 */
  function noise(n, seed) {
    const rand = rng(seed), g = new Float32Array(n * n).map(() => rand());
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), fx = smooth(x - xi), fy = smooth(y - yi);
      const x0 = (xi % n + n) % n, x1 = (x0 + 1) % n, y0 = (yi % n + n) % n * n, y1 = (y0 + n) % (n * n);
      const top = g[y0 + x0] + (g[y0 + x1] - g[y0 + x0]) * fx, bot = g[y1 + x0] + (g[y1 + x1] - g[y1 + x0]) * fx;

  }
  const canvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
  /* 把带正负号的明暗值写成一个像素：负 = 压暗，正 = 提亮 */
  function put(d, i, v) {
    const c = v < 0 ? SHADE : GLINT;

  }

  /* 纹理砖：先算一张“高度图”（平纹布 + 颜料的起伏 + 细颗粒），再假设光从左上打来，求出明暗 */
  function buildTile(dpr) {
    const P = Math.max(4, Math.round(3 * dpr)), N = 64, T = P * N;      // 线距（设备像素）× 根数
    const h = new Float32Array(T * T), rand = rng(29);
    const bend = noise(8, 3), bump = noise(32, 5), slub = noise(N, 7);
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const u = x / P + (bend(x / T * 8, y / T * 8) - .5) * .9, v = y / P + (bend(y / T * 8 + 3, x / T * 8 + 5) - .5) * .9;
      const i = Math.floor(u), j = Math.floor(v), a = Math.sin(Math.PI * (u - i)), b = Math.sin(Math.PI * (v - j));
      const warp = a * (.55 + .45 * b) * (.6 + .8 * slub(i, 0)), weft = b * (.55 + .45 * a) * (.6 + .8 * slub(j, 9));
      const weave = (i + j) & 1 ? warp : weft;                            // 经线纬线一上一下
      const relief = bump(x / T * 32, y / T * 32) + .5 * bump(x / T * 64 + 7, y / T * 64 + 2);
      h[y * T + x] = weave + relief * 1.5 + rand() * .5;
    }

    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const lit = h[(y + T - 1) % T * T + (x + T - 1) % T] - h[(y + 1) % T * T + (x + 1) % T];
      put(img.data, (y * T + x) * 4, lit > 0 ? lit * .085 : lit * .11);

  function init(S) {
    const { W, H, U, dpr, core, box } = S, ctx = $('finish').getContext('2d');
    if (tileDpr !== dpr) { tile = buildTile(dpr); tileDpr = dpr; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W * dpr, H * dpr);
    ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, W * dpr, H * dpr);

    /* 低分辨率算两张图再放大（自然就是柔和的）：wear = 布纹被颜料盖住多少；light = 光场 */
    const g = Math.ceil(Math.max(W, H) / 150), lw = Math.ceil(W / g), lh = Math.ceil(H / g);
    const wear = canvas(lw, lh), light = canvas(lw, lh), wx = wear.getContext('2d'), lx = light.getContext('2d');
    const wi = wx.createImageData(lw, lh), li = lx.createImageData(lw, lh);
    const cloud = noise(64, 13), k = g / U;
    const bx = (box.left + box.right) / 2, by = (box.top + box.bottom) / 2, feather = U * .2;
    const hw = Math.max(0, (box.right - box.left) / 2 - feather), hh = Math.max(0, (box.bottom - box.top) / 2 - feather);
    for (let j = 0; j < lh; j++) for (let i = 0; i < lw; i++) {
      const x = (i + .5) * g, y = (j + .5) * g, o = (j * lw + i) * 4;
      // 暗角：以大数字为中心的“方圆形”，到屏幕四边都是 1，四角更大
      const dx = Math.abs(x - core.x) / (x < core.x ? core.x : W - core.x), dy = Math.abs(y - core.y) / (y < core.y ? core.y : H - core.y);
      const q = Math.pow(Math.pow(dx, 2.6) + Math.pow(dy, 2.6), 1 / 2.6);
      const vignette = .34 * step(.62, 1.3, q) + .1 * step(U * .05, 0, Math.min(x, y, W - x, H - y));
      // 文字背后：圆角矩形向外羽化，没有边界
      const ex = Math.max(0, Math.abs(x - bx) - hw), ey = Math.max(0, Math.abs(y - by) - hh);
      const shade = .2 * step(feather * 2, feather * .5, Math.hypot(ex, ey));
      // 云斑：两层低频噪声，有的地方略沉、有的地方略亮
      const m = cloud(i * k * 3, j * k * 3) * .65 + cloud(i * k * 9 + 20, j * k * 9 + 40) * .35 - .5;
      put(li.data, o, m * (m < 0 ? .16 : .05) - vignette - shade);
      wi.data[o + 3] = 255 * (.15 + .7 * step(.35, .7, cloud(i * k * 5 + 31, j * k * 5 + 11)));
    }
    wx.putImageData(wi, 0, 0); lx.putImageData(li, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(wear, 0, 0, W * dpr, H * dpr);
    ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(light, 0, 0, W * dpr, H * dpr);
  }
  function frame() {}
  return { init, frame };
})();

/* ── 互动与偶遇：点一下溅起金色颜料和小爱心，拖动留下星尘，偶尔划过流星、亮起萤火，纪念日落一阵金屑。画在最上层的 #fx 上 ── */
const Fx = (() => {
  const PAINT = ['#ffcf3a', '#fff0c2', '#f4982c', '#a5ded2', '#f1a2b0'];        // 铬黄、奶白、橙、浅松石绿、玫瑰
  const GLOW = ['255,214,110', '255,244,214', '170,226,214', '226,238,140'];   // 金、奶白、松石、萤火
  const CELL = 40, COLS = 6;                     // 贴图集：每格 40px，一行 6 格
  const DAB = 0, HEART = 10, LIGHT = 14;         // 各类贴图的起始格：笔触 5 色 × 2 形，爱心 4 个，光晕 4 色
  const CAP = 170;                               // 同时存在的粒子上限（再乘画质）
  /* 一粒的默认属性。速度单位 px/s：drag 越大初速散得越快，flow 是被天空气流带着走的速度，rise 是上浮（负数即下落） */
  const BASE = { vx: 0, vy: 0, drag: 3.5, flow: 18, rise: 0, sway: 0, follow: false, ang: 0, spin: 0, wob: 0, grow: 0, pop: false, fadeIn: .07, hold: .4, a: .95, tw: 0, fly: false, soft: false };

  let S, ctx, atlas, bound = false;
  const pool = [], comets = [], flies = [];
  let n = 0;                                     // 活着的粒子数（pool 的前 n 个）
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;   // 上一帧画过的范围：下一帧只擦这一块
  let px = NaN, py = 0, run = 0, still = 0, strong = false, held = 0, drip = 0;   // 指针轨迹
  let heat = 0;                                  // 连点的热度：点得越急，每次溅得越少
  let nextStar = R(5500, 9500), seen = '', fete = NaN, extra = 0, shower = 0;     // 流星与纪念日的日程（ms，按 scene.age）

  /* ── 贴图 ── */
  /* 一道笔触：沿三次贝塞尔曲线 b，起笔饱满、收笔拖细；先垫暗影，再上颜料，拉几道鬃毛纹，受光一侧提亮（side = ±1 选哪一侧） */
  function mark(c, b, w, col, side, rand) {
    const N = 16, m = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      const x = u * u * u * b[0] + 3 * u * u * t * b[2] + 3 * u * t * t * b[4] + t * t * t * b[6];
      const y = u * u * u * b[1] + 3 * u * u * t * b[3] + 3 * u * t * t * b[5] + t * t * t * b[7];
      const tx = u * u * (b[2] - b[0]) + 2 * u * t * (b[4] - b[2]) + t * t * (b[6] - b[4]);
      const ty = u * u * (b[3] - b[1]) + 2 * u * t * (b[5] - b[3]) + t * t * (b[7] - b[5]);
      const hw = w / 2 * (t < .2 ? Math.sqrt(1 - Math.pow(1 - t / .2, 2)) : 1 - .82 * Math.pow((t - .2) / .8, 1.5)) / (Math.hypot(tx, ty) || 1);
      m.push([x, y, -ty * hw * side, tx * hw * side]);
    }
    const line = (k, from, to) => { c.beginPath(); for (let i = from; i <= to; i++) c.lineTo(m[i][0] + m[i][2] * k, m[i][1] + m[i][3] * k); };
    const body = () => { line(1, 0, N); for (let i = N; i >= 0; i--) c.lineTo(m[i][0] - m[i][2], m[i][1] - m[i][3]); c.closePath(); };
    c.lineCap = c.lineJoin = 'round';
    c.save(); c.translate(.8, .9); body(); c.fillStyle = 'rgba(6,12,44,.55)'; c.fill(); c.restore();
    body(); c.fillStyle = c.strokeStyle = col; c.lineWidth = 1; c.fill(); c.stroke();
    for (const [k, ink, lw] of [[-.2, 'rgba(255,255,255,.22)', .8], [.3, 'rgba(8,20,70,.16)', .8], [.62, 'rgba(8,20,70,.26)', 1], [-.62, 'rgba(255,255,255,.5)', 1]]) {
      line(k, Math.floor(rand() * 3), N - 1 - Math.floor(rand() * 4)); c.strokeStyle = ink; c.lineWidth = lw; c.stroke();
    }
  }
  function paintAtlas() {
    const d = S.dpr, rand = rng(5);
    atlas = atlas || document.createElement('canvas');
    atlas.width = COLS * CELL * d; atlas.height = 3 * CELL * d;
    const c = atlas.getContext('2d'), cell = i => c.setTransform(d, 0, 0, d, (i % COLS) * CELL * d, (i / COLS | 0) * CELL * d);
    PAINT.forEach((col, i) => {                  // 颜料点：朝 +x 方向甩出去的一小笔，一长一短两种
      cell(DAB + i * 2); mark(c, [35, 20, 26, 18.4, 14, 19, 4, 21.2], 9, col, -1, rand);
      cell(DAB + i * 2 + 1); mark(c, [33, 21.5, 26, 17, 16, 17.2, 8, 22], 10, col, -1, rand);
    });
    [PAINT[4], PAINT[1], PAINT[0], '#f6b9a4'].forEach((col, i) => {   // 爱心：左右各按下一笔，往心尖拖过去
      cell(HEART + i);
      mark(c, [13.6, 11.2, 9.6, 17, 14.5, 25.5, 20.8, 33], 15.4, col, 1, rand);
      mark(c, [26.8, 11.6, 30.6, 17, 25.6, 25, 19.6, 31.6], 14.8, col, -1, rand);
    });
    GLOW.forEach((rgb, i) => {                   // 柔光：中心奶白，向外化开
      cell(LIGHT + i);
      const g = c.createRadialGradient(20, 20, 0, 20, 20, 20);
      g.addColorStop(0, 'rgba(255,253,240,1)'); g.addColorStop(.14, `rgba(${rgb},.9)`); g.addColorStop(.4, `rgba(${rgb},.28)`); g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g; c.fillRect(0, 0, CELL, CELL);
    });
  }
  /* 把第 i 格贴图画到 (x, y)：sz 是整格的边长，(co, si) 是朝向 */
  function blit(i, x, y, sz, a, co, si) {
    const d = S.dpr, C = CELL * d, r = sz * .75;
    ctx.globalAlpha = a;
    ctx.setTransform(co * d, si * d, -si * d, co * d, x * d, y * d);
    ctx.drawImage(atlas, (i % COLS) * C, (i / COLS | 0) * C, C, C, -sz / 2, -sz / 2, sz, sz);
    if (x - r < x0) x0 = x - r; if (y - r < y0) y0 = y - r; if (x + r > x1) x1 = x + r; if (y + r > y1) y1 = y + r;
  }

  /* ── 粒子 ── */
  function add(o) {
    if (n >= CAP * S.quality) return;
    const p = pool[n] || (pool[n] = {}); n++;
    Object.assign(p, BASE, o); p.age = 0; p.ph = R(0, 6.3);
  }
  const hue = () => { const r = Math.random(); return r < .38 ? 0 : r < .64 ? 1 : r < .78 ? 2 : r < .92 ? 3 : 4; };
  const dab = c => DAB + c * 2 + (Math.random() < .5 ? 1 : 0);

  /* 点一下：一小团光，一把颜料点先溅开、再被气流带着慢慢飘起，几颗笔触画的小爱心。点在山丘和小镇上只惊起几只萤火虫 */
  function tap(e) {
    if (S.reduced) return;
    px = e.x; py = e.y; run = still = 0;
    heat++;
    const room = 1 - n / (CAP * S.quality), k = S.quality * Math.max(.25, room) / (1 + .45 * Math.max(0, heat - 1));
    let { x, y } = e;
    if (y > S.horizon) {
      for (let i = Math.ceil(4 * k); i--;) add({ spr: LIGHT + 3, x: x + R(-8, 8), y: y + R(-6, 6), vx: R(-60, 60), vy: R(-70, -10), drag: 2.4, flow: 5, rise: R(6, 16), sway: R(8, 18), size: R(9, 14), life: R(2.4, 4), fadeIn: .25, a: .9, tw: .45, fly: true });
      return;
    }
    const star = [...S.stars, S.moon].find(s => Math.hypot(x - s.x, y - s.y) < s.halo * .55);   // 点在星星或月亮上：它自己应一声，只有金与白
    if (star) { x = star.x; y = star.y; }
    const accent = star ? 0 : [0, 1, 3, 4][Math.floor(R(0, 4))];
    add({ spr: LIGHT + 1, x, y, flow: 0, size: 34, grow: 1.6, life: .45, hold: 0, a: .5 });
    add({ spr: LIGHT, x, y, flow: 0, size: 60, grow: .9, life: .7, hold: 0, a: .3 });
    for (let i = Math.max(4, Math.round(13 * k)); i--;) {
      const a = R(0, 6.283), v = R(70, 250), c = star ? (Math.random() < .6 ? 0 : 1) : Math.random() < .3 ? accent : hue();
      add({ spr: dab(c), x, y, vx: Math.cos(a) * v - Math.sin(a) * 50, vy: Math.sin(a) * v + Math.cos(a) * 50 - 45, drag: R(3.2, 4.8), flow: R(16, 28), rise: R(6, 18), follow: true, size: R(11, 18), life: R(1.3, 2.3), hold: .45 });
    }
    for (let i = Math.round(7 * k); i--;) {
      const a = R(0, 6.283), v = R(90, 300);
      add({ spr: LIGHT + (Math.random() < .6 ? 1 : star ? 0 : 2), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, drag: 3.4, flow: 14, rise: R(4, 12), size: R(5, 9), life: R(.6, 1.25), hold: .2, a: .9, tw: .6 });
    }
    for (let i = heat < 2.2 ? 2 + (Math.random() < .5) : 1; i--;)
      add({ spr: HEART + (star ? 1 + (i & 1) : Math.floor(R(0, 4))), x: x + R(-10, 10), y: y + R(-8, 4), vx: R(-34, 34), vy: R(-95, -45), drag: 2.6, flow: 12, rise: R(20, 32), sway: R(8, 16), ang: R(-.3, .3), wob: .2, size: R(21, 29), life: R(2, 2.9), hold: .5, pop: true, a: .92 });
  }

  /* 一粒星尘（k = 1 是手指，更小是鼠标路过）；地平线以下换成萤火 */
  function mote(x, y, k, lift) {
    if (y > S.horizon) {
      if (Math.random() < .4) add({ spr: LIGHT + 3, x, y, flow: 5, rise: R(4, 14), sway: R(6, 14), size: R(8, 12), life: R(1.4, 2.4), fadeIn: .2, a: .8 * k, tw: .5, fly: true });
    } else if (k === 1 && Math.random() < .16) {
      add({ spr: dab(Math.random() < .6 ? 0 : 1), x, y, vx: R(-20, 20), vy: R(-20, 20), flow: 16, rise: lift || R(4, 12), follow: true, size: R(8, 12), life: R(.8, 1.4), hold: .3, a: .9 });
    } else {
      add({ spr: LIGHT + (Math.random() < .62 ? 1 : Math.random() < .6 ? 0 : 2), x: x + R(-5, 5), y: y + R(-5, 5), vx: R(-14, 14), vy: R(-14, 14), flow: 14, rise: lift || R(2, 10), size: R(4.5, 8.5) * (.6 + .4 * k), life: R(.55, 1.15) * (.6 + .4 * k), hold: .2, a: .85 * k, tw: .55 });
    }
  }
  /* 手指（或按住的鼠标）划过：每隔几像素落一粒星尘；鼠标只是路过时安静得多。按住不动：指尖聚起一点光，光点慢慢往上飘 */
  function trail(s) {
    const p = S.pointer;
    let holding = false;
    if (!p.active) px = NaN;
    else if (px !== px) { px = p.x; py = p.y; run = still = 0; }
    else {
      const dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy);
      if (d > 140) run = 0;                      // 指针瞬移（换了一根手指）：不连线
      else {
        const gap = (strong ? 10 : 60) / S.quality;
        for (run += d; run >= gap; run -= gap) { const f = Math.random(); mote(px + dx * f, py + dy * f, strong ? 1 : .45); }
      }
      still = d < 40 * s ? still + s : 0;
      px = p.x; py = p.y;
      holding = strong && still > .3 && p.y < S.horizon;
    }
    held += ((holding ? 1 : 0) - held) * Math.min(1, s * 5);
    if (holding) for (drip += s * 8 * S.quality; drip >= 1; drip--) mote(p.x + R(-10, 10), p.y + R(-12, 4), 1, R(26, 46));
  }

  /* 流星：其实是一道很快画过去的笔触，起笔饱满，越拖越干。挑一条不压住大数字、尽量少碰文字的路线，只走上半天空 */
  function comet() {
    const { W, H, U, core, box } = S;
    let best, low = Infinity;
    for (let i = 0; i < 8; i++) {
      const dir = Math.random() < .7 ? 1 : -1, len = Math.min(320, Math.max(130, U * R(.34, .5))), tilt = R(.26, .66);
      const x = W * (.5 - dir * R(.02, .44)), y = H * R(.03, .25), ang = dir > 0 ? tilt : Math.PI - tilt;
      let score = Math.random();
      for (let j = 0; j <= 4; j++) {
        const qx = x + Math.cos(ang) * len * j / 4, qy = y + Math.sin(ang) * len * j / 4;
        if (qx > box.left && qx < box.right && qy > box.top && qy < box.bottom) score += 1;
        if (Math.hypot(qx - core.x, qy - core.y) < core.r) score += 9;
        if (qx < 0 || qx > W || qy > H * .42) score += 4;
      }
      if (score < low) { low = score; best = { x, y, ang, len }; }
    }
    const life = R(.6, .85);
    comets.push({ ...best, v: best.len / life, life, age: 0, run: 0, turn: R(-.45, .45), size: Math.max(17, Math.min(27, U * .046)) });
  }
  /* 日程：流星每隔十几秒一颗；纪念日头几秒从上空落一阵金屑，多三颗流星，然后归于平静 */
  function ambient(s) {
    const age = S.age;
    if (S.milestone !== seen) { seen = S.milestone; if (seen) { fete = Math.max(age, 1500); extra = 3; nextStar = fete + R(17000, 26000); } }
    const u = (age - fete) / 1000;
    if (u >= 0 && u < 9) {
      shower += s * 7 * Math.min(2.4, Math.max(1, S.W / 400)) * S.quality * Math.min(1, u / 1.2, (9 - u) / 3.5);
      for (; shower >= 1; shower--) {
        add({ spr: dab(Math.random() < .55 ? 0 : Math.random() < .5 ? 1 : Math.random() < .6 ? 2 : 4), x: R(0, S.W), y: R(-12, S.H * .2), rise: -R(30, 54), sway: R(10, 22), flow: 12, ang: R(0, 6.3), spin: R(-1.3, 1.3), size: R(10, 16), life: R(4, 6), fadeIn: .5, hold: .5, a: .85, soft: true });
      }
      if (extra && u > 9.4 - extra * 2.3) { comet(); extra--; }
    }
    if (age >= nextStar) { comet(); nextStar = age + R(10000, 25000); }
  }

  function init(scene) {
    S = scene; ctx = $('fx').getContext('2d'); ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    n = 0; comets.length = 0; x0 = y0 = Infinity; x1 = y1 = -Infinity; px = NaN;
    if (S.reduced) return;                       // 减弱动效：什么都不画，也不响应点按
    paintAtlas();
    const rand = rng(29), count = Math.max(3, Math.min(6, Math.round(S.W / 150)));
    flies.length = 0;                            // 萤火虫：各守着山丘、小镇上空的一小块地方
    for (let i = 0; i < count; i++) flies.push({ x: S.W * (.16 + .8 * rand()), y: S.H * (.815 + .105 * rand()), ph: rand() * 6.3, f: .55 + rand() * .45 });
    /* 一屏放得下时，把拖动整个交给页面（见 fx.css），否则浏览器会把它当成滚动，拖几像素就取消指针事件 */
    const main = document.querySelector('main');
    document.documentElement.classList.toggle('fx-still', !!main && main.scrollHeight <= main.clientHeight + 1);
    if (bound) return; bound = true;
    Scene.on('tap', tap);
    /* scene.pointer 不分触摸和鼠标，这里补记一下：手指、或按着键的鼠标才算“划”，光是鼠标路过不算 */
    const note = e => { strong = e.pointerType === 'touch' || e.buttons > 0; };
    for (const ev of ['pointerdown', 'pointermove', 'pointerup']) addEventListener(ev, note, { passive: true });
  }

  function frame(t, dt) {
    if (S.reduced) return;
    const s = dt / 1000, d = S.dpr, { core, horizon, box } = S;
    heat *= Math.exp(-s / .9);
    ambient(s); trail(s);
    if (x1 > x0) {                               // 只擦上一帧画过的那一块；什么都没画过就什么都不做
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.clearRect(x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 4);
      x0 = y0 = Infinity; x1 = y1 = -Infinity;
    }
    /* 萤火虫：慢慢游荡，亮一阵、暗一阵；暗的时候不画 */
    for (let i = Math.ceil(flies.length * S.quality); i-- && S.age > 2500;) {
      const f = flies[i], th = t * .001 * f.f, b = (Math.sin(th * .8 + f.ph * 3) - .4) / .6;
      if (b > 0) blit(LIGHT + 3, f.x + Math.sin(th * .37 + f.ph) * 26 + Math.sin(th * .83 + f.ph * 2) * 9, f.y + Math.sin(th * .53 + f.ph * 1.7) * 11, 15, b * b * (3 - 2 * b) * .85, 1, 0);
    }
    /* 流星：沿略弯的路线前进，一路留下颜料点，越到后面越细、越疏 */
    for (let i = comets.length; i--;) {
      const c = comets[i], k = (c.age += s) / c.life;
      if (k >= 1) { comets.splice(i, 1); continue; }
      const step = c.v * (1.3 - .6 * k) * s, co = Math.cos(c.ang += c.turn * s), si = Math.sin(c.ang), gap = c.size * (.36 + .5 * k);
      c.x += co * step; c.y += si * step;
      for (c.run += step; c.run >= gap; c.run -= gap) {
        add({ spr: dab(Math.random() < .5 - .3 * k ? 1 : Math.random() < .8 ? 0 : 2), x: c.x - co * c.run, y: c.y - si * c.run, vx: co * 26, vy: si * 26, drag: 3, flow: 0, ang: c.ang, size: c.size * (1.15 - .6 * k), life: R(.4, .56), fadeIn: .03, hold: .15, a: .95 - .35 * k, soft: true });
        if (Math.random() < .4) add({ spr: LIGHT + (Math.random() < .5 ? 1 : 2), x: c.x - co * c.run + R(-5, 5), y: c.y - si * c.run + R(-5, 5), flow: 8, size: R(4, 7), life: R(.4, .8), hold: .2, a: .8, tw: .5, soft: true });
      }
      blit(LIGHT + 1, c.x, c.y, c.size * 1.5, Math.pow(Math.sin(Math.PI * k), .5) * .95, 1, 0);
    }
    /* 粒子：初速很快散掉，之后跟着天空的气流走（自左向右的风，绕着大数字顺时针打转），柔和地淡出 */
    const r2 = core.r * core.r * .384, g = 3.8 * core.r * .62;
    let j = 0;
    for (let i = 0; i < n; i++) {
      const p = pool[i], k = (p.age += s) / p.life;
      if (k >= 1) continue;
      if (i !== j) { pool[i] = pool[j]; pool[j] = p; }
      j++;
      const ex = p.x - core.x, ey = p.y - core.y, w = g * Math.exp(-(ex * ex + ey * ey) / r2 * .5) / r2;
      const wx = 1 - w * ey, wy = .22 * Math.sin(p.x * .008 + p.y * .005 + t * .0002) + w * ex, wm = p.flow / (Math.hypot(wx, wy) || 1) * Math.min(2, .55 + .45 * Math.hypot(wx, wy));
      const e = Math.exp(-p.drag * s);
      p.vx *= e; p.vy *= e;
      const ux = p.vx + wx * wm + Math.sin(p.age * 2.1 + p.ph) * p.sway, uy = p.vy + wy * wm - p.rise;
      p.x += ux * s; p.y += uy * s;
      let a = p.a * Math.min(1, p.age / p.fadeIn) * (k < p.hold ? 1 : .5 + .5 * Math.cos(Math.PI * (k - p.hold) / (1 - p.hold)));
      if (p.tw) a *= 1 - p.tw * (.5 + .5 * Math.sin(p.age * 9 + p.ph * 7));
      if (!p.fly) a *= Math.min(1, Math.max(0, (horizon - p.y) / 24));                                   // 地平线以下只留萤火
      if (p.soft && p.x > box.left && p.x < box.right && p.y > box.top && p.y < box.bottom) a *= .55;     // 久留的东西经过文字时更淡
      if (a < .012) continue;
      const sz = p.size * (1 + p.grow * k) * (p.pop ? Math.min(1, .4 + p.age * 2.4) : 1);
      if (p.spr >= LIGHT) { blit(p.spr, p.x, p.y, sz, a, 1, 0); continue; }
      const ang = p.follow ? Math.atan2(uy, ux) : p.ang + p.spin * p.age + Math.sin(p.age * 2.4 + p.ph) * p.wob;
      blit(p.spr, p.x, p.y, sz, a, Math.cos(ang), Math.sin(ang));
    }
    n = j;
    if (held > .02) blit(LIGHT, S.pointer.x, S.pointer.y, 78 + 6 * Math.sin(t * .004), held * .34, 1, 0);
    ctx.globalAlpha = 1;
  }
  return { init, frame };
})();

/* ── 总控：排版、主循环、指针、帧率保护 ── */
(() => {
  const mods = { Sky, Lights, Land, Finish, Fx };          // 由下到上的绘制顺序
  const names = Object.keys(mods), S = Scene;
  const prof = window.__PROF ? {} : null;                  // 调试用：统计每层每帧耗时
  let lastW = 0, lastH = 0, last = 0, t0 = 0, ema = 16, slow = 0, timer = 0;

  function layout(force) {
    const W = innerWidth, H = innerHeight;
    if (!force && W === lastW && Math.abs(H - lastH) < 120) return;   // 手机地址栏伸缩时不重排
    lastW = W; lastH = H;
    S.W = W; S.H = H; S.U = Math.min(W, H); S.dpr = Math.min(devicePixelRatio || 1, 2);
    for (const id of ['sky', 'lights', 'land', 'finish', 'fx']) { const c = $(id); c.width = Math.round(W * S.dpr); c.height = Math.round(H * S.dpr); }
    Object.assign(S, UI.measure());
    S.horizon = H * .83;
    Lights.compose(S);
    for (const n of names) mods[n].init(S);
    if (S.reduced) { S.age = Infinity; for (const n of names) mods[n].frame(0, 16); }
  }
  function loop(t) {
    const raw = t - last || 16, dt = Math.min(50, raw); last = t; S.t = t; S.age = t - (t0 = t0 || t);
    for (const n of names) {
      if (!prof) { mods[n].frame(t, dt); continue; }
      const a = performance.now(); mods[n].frame(t, dt);
      const p = prof[n] = prof[n] || { sum: 0, n: 0, max: 0 }, d = performance.now() - a; p.sum += d; p.n++; p.max = Math.max(p.max, d);
    }
    if (!prof && raw < 200) {                               // 连续卡顿就降一档画质，只降不升
      ema += (raw - ema) * .05;
      slow = ema > 24 ? slow + 1 : 0;
      if (slow > 90 && S.quality > .4) { S.quality = Math.max(.4, S.quality - .15); slow = 0; ema = 16; S.emit('quality', S.quality); }
    }
    requestAnimationFrame(loop);
  }
  if (prof) window.__prof = () => Object.fromEntries(Object.entries(prof).map(([k, p]) => [k, { avg: +(p.sum / p.n).toFixed(2), max: +p.max.toFixed(1) }]));

  addEventListener('pointermove', e => { S.pointer.x = e.clientX; S.pointer.y = e.clientY; S.pointer.active = true; });
  addEventListener('pointerdown', e => {
    S.pointer.x = e.clientX; S.pointer.y = e.clientY; S.pointer.active = true;
    if (!e.target.closest('a, button')) S.emit('tap', { x: e.clientX, y: e.clientY });
  });
  for (const ev of ['pointerleave', 'pointercancel', 'pointerup']) addEventListener(ev, e => { if (ev !== 'pointerup' || e.pointerType !== 'mouse') S.pointer.active = false; });
  document.addEventListener('mouseleave', () => { S.pointer.active = false; });
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(layout, 160); });

  UI.init();
  layout(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
  if (!S.reduced) requestAnimationFrame(loop);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我和 cc 的日子</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Fredoka:wght@500;600&family=Oswald:wght@500&family=Outfit:wght@200;400&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：一屏居中的计时卡片，背后一整块画布做氛围动画；底部切换四种风格。
   每种风格是一套独立的色彩与字体令牌，写在 :root[data-look] 上。 */
:root {
  /* 星河（默认） */
  color-scheme: dark;
  --bg: #060a1e; --bg2: #1b1548;
  --fg: #f4eeff; --muted: #aaa4d2;
  --accent: #ffdca8; --accent2: #ff9ecb;
  --num-fill: linear-gradient(180deg, #fff3d6 10%, #ffcf9a 55%, #ff9ecb 100%);
  --glow: drop-shadow(0 0 28px rgba(255, 190, 160, .45));
  --chip: rgba(255, 255, 255, .08); --line: rgba(255, 255, 255, .18);
  --card-bg: transparent; --card-line: transparent; --card-shadow: none;
  --flap: #1b1917; --flap-fg: #fff6e8;
  --font-num: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
  --font-zh: "Noto Serif SC", "Songti SC", "PingFang SC", serif;
  --num-weight: 300; --num-size: clamp(92px, 31vw, 200px);
  --title-space: .5em;
}
:root[data-look="sakura"] {
  color-scheme: light;
  --bg: #ffe6ec; --bg2: #ffc7b6;
  --fg: #6b2440; --muted: #a05a76;
  --accent: #e0457b; --accent2: #ff8fb0;
  --num-fill: linear-gradient(160deg, #ff7aa5, #d93672);
  --glow: drop-shadow(0 6px 0 rgba(255, 255, 255, .9));
  --chip: rgba(255, 255, 255, .55); --line: rgba(224, 69, 123, .25);
  --card-bg: rgba(255, 255, 255, .42); --card-line: rgba(255, 255, 255, .85);
  --card-shadow: 0 24px 60px -20px rgba(214, 70, 120, .45);
  --font-num: "Fredoka", "ZCOOL KuaiLe", "PingFang SC", sans-serif;
  --font-zh: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --num-weight: 600; --num-size: clamp(84px, 27vw, 170px);
  --title-space: .12em;
}
:root[data-look="flip"] {
  color-scheme: light;
  --bg: #f6a01c; --bg2: #e2560a;
  --fg: #1f1206; --muted: #4a2603;
  --accent: #1b1917; --accent2: #fff1d6;
  --num-fill: none; --glow: none;
  --chip: rgba(31, 18, 6, .13); --line: rgba(31, 18, 6, .3);
  --font-num: "Oswald", "PingFang SC", Impact, sans-serif;
  --font-zh: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --num-weight: 500; --num-size: clamp(78px, 24vw, 160px);
  --title-space: .3em;
}
:root[data-look="heart"] {
  color-scheme: dark;
  --bg: #080407; --bg2: #1c0613;
  --fg: #fff5f8; --muted: #cf9db0;
  --accent: #ff4d7d; --accent2: #ffa3bd;
  --num-fill: linear-gradient(180deg, #ffffff 30%, #ffb3c8);
  --glow: drop-shadow(0 0 22px rgba(255, 77, 125, .85));
  --chip: rgba(255, 77, 125, .12); --line: rgba(255, 120, 160, .35);
  --font-num: "Outfit", "PingFang SC", sans-serif;
  --font-zh: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --num-weight: 200; --num-size: clamp(64px, 20vw, 120px);
  --title-space: .6em;
}

html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: linear-gradient(170deg, var(--bg), var(--bg2));
  color: var(--fg);
  font-family: var(--font-zh);
  -webkit-tap-highlight-color: transparent;
  transition: color .5s;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

main {
  position: fixed; inset: 0; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  max-width: 100%; box-sizing: border-box; text-align: center;
  background: var(--card-bg); border: 1px solid var(--card-line);
  box-shadow: var(--card-shadow); border-radius: 36px;
  animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: .0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }

h1 {
  margin: 0; font-size: clamp(17px, 4.6vw, 24px); font-weight: 400;
  letter-spacing: var(--title-space); text-indent: var(--title-space);
}
.core { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.num {
  display: flex; align-items: baseline; justify-content: center;
  font-family: var(--font-num); font-weight: var(--num-weight);
  font-size: var(--num-size); line-height: 1;
  font-variant-numeric: lining-nums tabular-nums;
  filter: var(--glow);
}
.unit { font-size: clamp(15px, 4vw, 20px); color: var(--muted); letter-spacing: .4em; text-indent: .4em; }

/* 数字组件：普通风格只显示 .v；翻页风格显示四片翻牌 */
.dg { position: relative; display: inline-block; }
.dg .v { background: var(--num-fill); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dg .h { display: none; }

.since { font-size: clamp(13px, 3.6vw, 16px); color: var(--muted); letter-spacing: .08em; }
.live {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 12px;
  font-size: clamp(15px, 4.2vw, 19px);
}
.clock { display: inline-flex; align-items: baseline; font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 1.15em; }
.clock i { font-style: normal; padding: 0 .12em; opacity: .7; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.chip {
  padding: 7px 14px; border-radius: 999px; font-size: 13px;
  background: var(--chip); border: 1px solid var(--line);
}
.chip b { font-weight: 600; color: var(--accent); }

/* ── 星河：数字外一圈缓慢转动的轨道 ── */
:root[data-look="starry"] .core, :root:not([data-look]) .core {
  width: min(78vw, 44vh, 420px); aspect-ratio: 1; margin-block: 4px;
}
:root[data-look="starry"] .core::before, :root:not([data-look]) .core::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 1px dashed var(--line);
  background: radial-gradient(circle at 50% 0, var(--accent) 0 4px, transparent 5px) no-repeat;
  animation: spin 40s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 樱花：毛玻璃卡片 ── */
:root[data-look="sakura"] .card { padding: 34px clamp(20px, 6vw, 44px) 30px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
:root[data-look="sakura"] h1 { font-size: clamp(22px, 6vw, 30px); }
:root[data-look="sakura"] .num { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-1deg); } }

/* ── 翻页：机场翻牌 ── */
:root[data-look="flip"] h1 { font-weight: 700; }
:root[data-look="flip"] .num { gap: .07em; margin-block: 10px 4px; }
:root[data-look="flip"] .dg { width: .7em; height: 1.3em; perspective: 400px; }
:root[data-look="flip"] .dg .v { visibility: hidden; }
:root[data-look="flip"] .dg .h {
  display: block; position: absolute; left: 0; right: 0; height: 50%; overflow: hidden;
  background: var(--flap); color: var(--flap-fg); backface-visibility: hidden;
}
.dg .h s { display: flex; align-items: center; justify-content: center; height: 200%; text-decoration: none; }
.dg .t, .dg .ft { top: 0; border-radius: .1em .1em 0 0; transform-origin: bottom; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .7); }
.dg .b, .dg .fb { bottom: 0; border-radius: 0 0 .1em .1em; transform-origin: top; background-image: linear-gradient(rgba(255, 255, 255, .07), transparent); }
.dg .b s, .dg .fb s { transform: translateY(-50%); }
.dg .ft { transform: rotateX(-90deg); }
.dg .fb { transform: rotateX(90deg); }
.dg.go .ft { animation: foldTop .2s ease-in both; }
.dg.go .fb { animation: foldBot .2s .2s ease-out both; }
@keyframes foldTop { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
@keyframes foldBot { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }
:root[data-look="flip"] .num .dg { box-shadow: 0 .09em .16em rgba(60, 20, 0, .45); border-radius: .1em; }
:root[data-look="flip"] .clock { font-size: 1.7em; gap: .08em; }
:root[data-look="flip"] .unit, :root[data-look="flip"] .since { color: var(--fg); }

/* ── 心跳：数字坐在粒子爱心正中 ── */
:root[data-look="heart"] .core { width: min(92vw, 50vh, 460px); aspect-ratio: 1 / .92; }
:root[data-look="heart"] .num { animation: beat 1.15s ease-out infinite; }
@keyframes beat { 0% { transform: scale(1.06); } 22% { transform: scale(1); } 28% { transform: scale(1.035); } 55%, 100% { transform: scale(1); } }

/* ── 风格切换 ── */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.looks {
  display: flex; gap: 4px; padding: 5px; border-radius: 999px; pointer-events: auto;
  background: var(--chip); border: 1px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.looks button {
  appearance: none; border: 0; background: none; color: var(--fg); cursor: pointer;
  font: 500 14px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding: 11px 15px; border-radius: 999px; transition: background .3s, color .3s;
}
.looks button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.looks button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<main id="stage">
  <section class="card" id="card">
    <h1 id="title"></h1>
    <div class="core" id="core">
      <div class="num" id="days" aria-live="off"></div>
      <div class="unit">天</div>
    </div>
    <div class="since" id="since"></div>
    <div class="live">
      <span id="ymd"></span>
      <span class="clock" aria-hidden="true"><span id="hh"></span><i>:</i><span id="mm"></span><i>:</i><span id="ss"></span></span>
    </div>
    <div class="chips" id="chips"></div>
  </section>
</main>

<nav aria-label="风格">
  <div class="looks" id="looks">
    <button type="button" data-look="starry">星河</button>
    <button type="button" data-look="sakura">樱花</button>
    <button type="button" data-look="flip">翻页</button>
    <button type="button" data-look="heart">心跳</button>
  </div>
</nav>

<script>
/* ═════ 只需要改这里 ═════ */
const CONFIG = {
  title: '我和 cc 已经',
  start: [2023, 4, 13],          // 起始日：年, 月, 日
  defaultLook: 'starry'          // starry 星河 / sakura 樱花 / flip 翻页 / heart 心跳
};
/* ═══════════════════════ */

const LOOKS = ['starry', 'sakura', 'flip', 'heart'];
const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let look = CONFIG.defaultLook;

/* ── 日期计算 ── */
const [SY, SM, SD] = CONFIG.start;
const startUTC = Date.UTC(SY, SM - 1, SD);
const DAY = 86400000;
const todayUTC = now => Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
const daysSince = now => Math.round((todayUTC(now) - startUTC) / DAY);
function ymdSince(now) {
  let y = now.getFullYear() - SY, m = now.getMonth() + 1 - SM, d = now.getDate() - SD;
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return [y, m, d];
}
const SPECIAL = { 520: '我爱你', 1314: '一生一世', 3344: '生生世世', 5200: '我爱你', 9999: '长长久久' };
function nextMilestone(n) {
  const c = Object.keys(SPECIAL).map(Number);
  c.push((Math.floor(n / 500) + 1) * 500, (Math.floor(n / 1000) + 1) * 1000);
  return Math.min(...c.filter(x => x > n));
}
function nextAnniversary(now) {
  let y = now.getFullYear();
  if (Date.UTC(y, SM - 1, SD) <= todayUTC(now)) y++;
  return { years: y - SY, left: Math.round((Date.UTC(y, SM - 1, SD) - todayUTC(now)) / DAY) };
}

/* ── 数字组件 ── */
function makeDigit(v) {
  const el = document.createElement('span');
  el.className = 'dg'; el.dataset.v = v;
  el.innerHTML = `<span class="v">${v}</span><span class="h t"><s>${v}</s></span><span class="h b"><s>${v}</s></span><span class="h ft"><s>${v}</s></span><span class="h fb"><s>${v}</s></span>`;
  return el;
}
function setDigit(el, v, animate = true) {
  const old = el.dataset.v;
  if (old === v) return;
  el.dataset.v = v;
  const [val, t, b, ft, fb] = [...el.children].map(c => c.firstElementChild || c);
  val.textContent = v; t.textContent = v; fb.textContent = v; ft.textContent = old;
  if (!animate || reduced || look !== 'flip') { b.textContent = v; return; }
  b.textContent = old;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  setTimeout(() => { if (el.dataset.v === v) b.textContent = v; }, 400);
}
function setNumber(box, str, animate = true) {
  while (box.children.length > str.length) box.lastChild.remove();
  while (box.children.length < str.length) box.appendChild(makeDigit(''));
  [...str].forEach((ch, i) => setDigit(box.children[i], ch, animate));
}

/* ── 刷新文字 ── */
const pad = n => String(n).padStart(2, '0');
let shownDays = -1, counting = 0;
function tick() {
  const now = new Date(), n = daysSince(now);
  if (n !== shownDays) {
    shownDays = n;
    if (!counting) setNumber($('days'), String(n));
    $('days').setAttribute('aria-label', n + ' 天');
    const [y, m, d] = ymdSince(now);
    $('ymd').textContent = [y && y + ' 年', m && m + ' 个月', d + ' 天'].filter(Boolean).join(' ');
    const ms = nextMilestone(n), an = nextAnniversary(now);
    $('chips').innerHTML =
      `<span class="chip">第 <b>${ms}</b> 天${SPECIAL[ms] ? ' · ' + SPECIAL[ms] : ''} · 还有 ${ms - n} 天</span>` +
      `<span class="chip"><b>${an.years}</b> 周年 · 还有 ${an.left} 天</span>`;
  }
  setNumber($('hh'), pad(now.getHours()));
  setNumber($('mm'), pad(now.getMinutes()));
  setNumber($('ss'), pad(now.getSeconds()));
}
function countUp() {
  const id = ++counting, target = String(shownDays), box = $('days');
  const done = () => { if (id === counting) { counting = 0; setNumber(box, String(shownDays)); } };
  if (reduced) return done();
  if (look === 'flip') {
    setNumber(box, '0'.repeat(target.length), false);
    [...target].forEach((ch, i) => setTimeout(() => { if (id === counting) setDigit(box.children[i], ch); }, 350 + i * 170));
    return setTimeout(done, 400 + target.length * 170);
  }
  const t0 = performance.now(), dur = 1500;
  (function step(t) {
    if (id !== counting) return;
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    setNumber(box, String(Math.round(shownDays * e)), false);
    p < 1 ? requestAnimationFrame(step) : done();
  })(t0);
}

/* ── 画布氛围 ── */
const cv = $('sky'), ctx = cv.getContext('2d');
let W = 0, H = 0, parts = [], extra = [], bursts = [], frameNo = 0, coreBox = null, lastShoot = 0;
const R = (a, b) => a + Math.random() * (b - a);
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  seed();
}
function seed() {
  parts = []; extra = []; coreBox = null;
  const area = W * H;
  if (look === 'starry') {
    for (let i = 0, n = Math.min(360, area / 2600); i < n; i++)
      parts.push({ x: R(0, W), y: R(0, H), r: R(.3, 1.7), p: R(0, 6.3), s: R(.4, 1.6) });
  } else if (look === 'sakura') {
    for (let i = 0, n = Math.min(70, area / 11000); i < n; i++) parts.push(petal(true));
  } else if (look === 'flip') {
    for (let i = 0, n = Math.min(26, area / 26000); i < n; i++)
      parts.push({ x: R(0, W), y: R(0, H), r: R(20, 90), v: R(.08, .3), a: R(.04, .13), p: R(0, 6.3) });
  } else if (look === 'heart') {
    for (let i = 0; i < 1300; i++) {
      const edge = i < 950;
      parts.push({ t: R(0, 6.2832), f: edge ? 1 - Math.pow(Math.random(), 2.4) * .22 : R(1.02, 1.5),
        j: R(0, 6.3), r: R(.6, edge ? 2 : 1.4), h: R(332, 356), halo: !edge, life: Math.random() });
    }
  }
}
function petal(anywhere) {
  return { x: R(-40, W + 40), y: anywhere ? R(-20, H) : -20, s: R(6, 14), rot: R(0, 6.3), vr: R(-.02, .02),
    vy: R(.5, 1.5), ph: R(0, 6.3), fl: R(0, 6.3), c: ['#ffb7cd', '#ff9dbb', '#ffd2de', '#ffffff'][Math.floor(R(0, 4))] };
}
function heartPath(s) {
  ctx.beginPath(); ctx.moveTo(0, s * .8);
  ctx.bezierCurveTo(-s * 1.25, -s * .1, -s * .6, -s, 0, -s * .35);
  ctx.bezierCurveTo(s * .6, -s, s * 1.25, -s * .1, 0, s * .8);
}
const draw = {
  starry(t) {
    for (const s of parts) {
      s.x -= s.r * .02; if (s.x < -2) s.x = W + 2;
      const tw = .35 + .65 * Math.pow(Math.sin(t * .001 * s.s + s.p), 2);
      ctx.globalAlpha = tw; ctx.fillStyle = s.r > 1.3 ? '#ffe9c9' : '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill();
    }
    if (t - lastShoot > 2600 && Math.random() < .02) {
      lastShoot = t;
      extra.push({ x: R(W * .2, W * 1.1), y: R(-20, H * .35), vx: R(-9, -6), vy: R(3, 5), life: 1 });
    }
    for (const m of extra) {
      m.x += m.vx; m.y += m.vy; m.life -= .016;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 14, m.y - m.vy * 14);
      g.addColorStop(0, `rgba(255,240,220,${Math.max(m.life, 0)})`); g.addColorStop(1, 'rgba(255,240,220,0)');
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 14, m.y - m.vy * 14); ctx.stroke();
    }
    extra = extra.filter(m => m.life > 0);
  },
  sakura(t) {
    parts.forEach((p, i) => {
      p.y += p.vy; p.x += Math.sin(t * .001 + p.ph) * .8 + .35; p.rot += p.vr; p.fl += .03;
      if (p.y > H + 20 || p.x > W + 50) parts[i] = petal(false);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, .35 + .65 * Math.abs(Math.cos(p.fl)));
      ctx.globalAlpha = .85; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.moveTo(0, -p.s);
      ctx.bezierCurveTo(p.s * .95, -p.s * .6, p.s * .7, p.s * .8, 0, p.s);
      ctx.bezierCurveTo(-p.s * .7, p.s * .8, -p.s * .95, -p.s * .6, 0, -p.s);
      ctx.fill(); ctx.restore();
    });
  },
  flip(t) {
    for (const b of parts) {
      b.y -= b.v; if (b.y < -b.r) { b.y = H + b.r; b.x = R(0, W); }
      const x = b.x + Math.sin(t * .0004 + b.p) * 20;
      const g = ctx.createRadialGradient(x, b.y, 0, x, b.y, b.r);
      g.addColorStop(0, `rgba(255,244,210,${b.a * 1.6})`); g.addColorStop(.7, `rgba(255,244,210,${b.a})`); g.addColorStop(1, 'rgba(255,244,210,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 6.3); ctx.fill();
    }
  },
  heart(t) {
    if (!coreBox || frameNo % 30 === 0) coreBox = $('core').getBoundingClientRect();
    const k = Math.min(coreBox.width / 35, coreBox.height / 31);
    const cx = coreBox.left + coreBox.width / 2, cy = coreBox.top + coreBox.height / 2 - 2.5 * k;
    const ph = (t % 1150) / 1150, pulse = p => p < 0 ? 0 : Math.exp(-p * 9);
    const beat = 1 + .07 * Math.max(pulse(ph), .55 * pulse(ph - .26));
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      let f = p.f, a = .55 + .45 * Math.sin(t * .003 + p.j);
      if (p.halo) { p.life += .004; if (p.life > 1) { p.life = 0; p.t = R(0, 6.2832); } f = 1 + p.life * .55; a = (1 - p.life) * .7; }
      const s = Math.sin(p.t), c = Math.cos(p.t);
      const hx = 16 * s * s * s, hy = 13 * c - 5 * Math.cos(2 * p.t) - 2 * Math.cos(3 * p.t) - Math.cos(4 * p.t);
      const x = cx + hx * k * f * beat + Math.sin(t * .002 + p.j) * 1.6;
      const y = cy - hy * k * f * beat + Math.cos(t * .0017 + p.j * 2) * 1.6;
      ctx.globalAlpha = a; ctx.fillStyle = `hsl(${p.h},100%,${p.halo ? 72 : 62}%)`;
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.3); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
};
function drawBursts() {
  for (const b of bursts) {
    b.x += b.vx; b.y += b.vy; b.vy += .05; b.life -= .014;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.vx * .15);
    ctx.globalAlpha = Math.max(b.life, 0); ctx.fillStyle = b.c;
    heartPath(b.s * (.6 + .4 * b.life)); ctx.fill(); ctx.restore();
  }
  bursts = bursts.filter(b => b.life > 0);
}
function frame(t) {
  frameNo++;
  ctx.clearRect(0, 0, W, H);
  draw[look](t);
  drawBursts();
  ctx.globalAlpha = 1;
  if (!reduced) requestAnimationFrame(frame);
}

/* ── 点哪儿，哪儿冒出小爱心 ── */
addEventListener('pointerdown', e => {
  if (e.target.closest('nav') || reduced) return;
  const cs = getComputedStyle(root), cols = [cs.getPropertyValue('--accent2').trim(), cs.getPropertyValue('--accent').trim()];
  if (look === 'flip') cols[1] = cols[0];
  for (let i = 0; i < 12; i++)
    bursts.push({ x: e.clientX, y: e.clientY, vx: R(-2.6, 2.6), vy: R(-4.5, -1), s: R(6, 13), life: 1, c: cols[i % 2] });
});

/* ── 风格切换 ── */
function applyLook(name, animate = true) {
  look = LOOKS.includes(name) ? name : CONFIG.defaultLook;
  root.dataset.look = look;
  for (const b of $('looks').children) b.setAttribute('aria-pressed', b.dataset.look === look);
  const card = $('card'); card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  seed();
  if (animate) countUp();
  if (reduced) requestAnimationFrame(frame);
  try { localStorage.setItem('look', look); } catch (e) {}
}
$('looks').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  try { location.hash = b.dataset.look; } catch (err) {}
  if (look !== b.dataset.look) applyLook(b.dataset.look);
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LOOKS.includes(h) && h !== look) applyLook(h); });
addEventListener('resize', () => { resize(); if (reduced) requestAnimationFrame(frame); });

/* ── 启动 ── */
$('title').textContent = CONFIG.title;
{
  const d = new Date(SY, SM - 1, SD);
  $('since').textContent = `起始日 ${SY}-${SM}-${SD} 星期${'日一二三四五六'[d.getDay()]}`;
  let saved = ''; try { saved = localStorage.getItem('look') || ''; } catch (e) {}
  const h = location.hash.slice(1);
  look = LOOKS.includes(h) ? h : LOOKS.includes(saved) ? saved : CONFIG.defaultLook;
  root.dataset.look = look;
}
tick();
resize();
applyLook(look);
setInterval(tick, 1000);
if (!reduced) requestAnimationFrame(frame);
</script>

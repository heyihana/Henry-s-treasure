<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris & Henry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1b4b">
<!-- 字体：Fraunces 柔和的斜体写名字、它的直立体只取 0-9 排数字；思源宋体只取页面上用到的汉字（约 10 KB）。
     样式表异步加载（media=print 加载完再切成 all）：字体服务器慢或连不上时，页面照常立刻显示，用系统字体。
     改了 ui.js / ui.body.html 里的中文，要把新字补进下面 text= 里 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-font media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,48,400,100,1&amp;display=swap">
<link rel="stylesheet" data-font media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..500,0..100&amp;family=Noto+Serif+SC:wght@500&amp;display=swap&amp;text=0123456789·〇一七三世两个久九二于五今你八六分十周四在天始就年我日时星是月有期爱生百的秒第至起还长">
<style>
/* 布局：一屏。几层画布叠成会流动的星月夜，文字居中叠在天空上。 */
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--sky); color: var(--fg); -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* ── 文字层：名字、“在一起的第 N 天”、起始日、走动的时钟、下一个纪念日 ── */
:root {
  color-scheme: dark;
  --sky: #0d1b4b;                /* 页面底色（画布出来之前） */
  --fg: #fbf0d2;                 /* 奶油白：名字 */
  --pale: #dfe7f8;               /* 月光蓝白：小字 */
  --mute: #a9b9df;               /* 更淡的灰蓝：说明性的字 */
  --gold: #f6c94e;               /* 铬黄：小号数字 */
  --ink: 5, 10, 34;              /* 压在字下面的深蓝（rgb） */
  --halo: 0 0 1px rgba(var(--ink), .7), 0 1px 3px rgba(var(--ink), .65), 0 0 14px rgba(var(--ink), .5);
  --latin: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --zh: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
  --ease: cubic-bezier(.22, .68, .2, 1);
  /* 版面尺度：--fs 小字字号，--D 大数字所在“旋涡眼”的直径。全部只跟窗口有关、不跟字体有关，
     所以字体晚到、换上来时，量出来的位置一点不变 */
  --fs: max(12px, min(3.75vw, 1.9vh, 20px));
  --D: min(82vw, 40vh, 400px);
}
main {
  position: fixed; inset: 0; overflow: hidden auto; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
  /* 底部留出山丘与小镇（文字不低于 H*.80）；顶部略留空，让数字落在画面偏中的位置 */
  padding: max(12px, 6vh, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           calc(20vh + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
main:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
.card {
  position: relative; box-sizing: border-box; width: min(100%, 22em); margin-block: auto;
  display: flex; flex-direction: column; align-items: center;
  font: 500 var(--fs)/1.5 var(--zh); color: var(--pale); text-align: center; white-space: nowrap;
  font-synthesis: none; text-shadow: var(--halo); -webkit-font-smoothing: antialiased;
}
.card p { margin: 0; }
.card b { font-weight: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* 名字：题献。柔软的斜体，& 用铬黄 */
.names {
  position: relative; margin: 0;
  font: italic 400 2.5em/1.2 var(--latin); color: var(--fg); letter-spacing: .005em;
}
.amp { color: var(--gold); padding: 0 .02em; }

/* 在一起的第 · 大数字 · 天 */
.count { display: flex; flex-direction: column; align-items: center; margin-top: .85em !important; }
.lead, .unit { position: relative; z-index: 1; letter-spacing: .5em; padding-left: .5em; color: var(--pale); }
.lead { font-size: 1.06em; }
.unit { font-size: 1.2em; }
.core {
  position: relative; flex: none; display: grid; place-items: center;
  width: var(--D); height: var(--D); margin-block: calc(var(--D) * -.215);
  /* 数字字号：一两位时由旋涡眼决定；位数多了按屏宽缩小（这款数字最宽的 0 约 .57em） */
  --F: min(calc(var(--D) * .64), calc((100vw - 40px) * .94 / (var(--n) * .56 + .12)));
}
.core { --n: 2; }
.digits { display: grid; }
.num {
  grid-area: 1 / 1; padding: 0 .05em;
  font: 300 var(--F)/1 "Fraunces", "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  font-variation-settings: "opsz" 144, "SOFT" 100;
  font-variant-numeric: lining-nums; letter-spacing: -.015em;
}
.num i, .live i { display: inline-block; font-style: normal; text-align: center; }
/* 数字像月亮那样被颜料画出来的光：上亮下暖的铬黄，右上方（月亮那边）受光，叠一层极细的同心笔痕，和四周的旋涡同向 */
.gold {
  color: #ffd860;
  background:
    radial-gradient(ellipse 60% 45% at 72% 12%, rgba(255, 253, 238, .45), rgba(255, 253, 238, 0)),
    repeating-radial-gradient(circle at 50% 46%, rgba(255, 252, 235, 0) 0 .016em, rgba(255, 252, 235, .11) .021em, rgba(255, 252, 235, 0) .026em),
    linear-gradient(174deg, #fff7d8 6%, #ffe58e 30%, #fbca46 60%, #ef9d2c 94%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none;
}
/* 垫在金色下面的一份：深蓝细边把字从画面里托出来，外面一圈暖光 */
.shade {
  -webkit-text-fill-color: transparent; color: transparent;
  text-shadow: 0 0 .008em rgba(var(--ink), .85), 0 .012em .05em rgba(var(--ink), .7), 0 0 .3em rgba(255, 184, 60, .3);
}

/* 小字：起始日、至今、下一个纪念日 */
.notes { position: relative; display: flex; flex-direction: column; align-items: center; gap: .35em; margin-top: 2.1em; }
.notes::before, .names::before {           /* 字下面一层羽化的深蓝薄涂，没有边 */
  content: ''; position: absolute; z-index: -1; inset: -.9em -2.2em;
  background: radial-gradient(closest-side, rgba(var(--ink), .5), rgba(var(--ink), .28) 60%, rgba(var(--ink), 0));
}
.names::before { inset: -.25em -.6em; }
.notes b { font-family: var(--latin), var(--zh); font-variant-numeric: lining-nums tabular-nums; }
.notes b { font-variation-settings: "opsz" 14, "SOFT" 50; font-weight: 400; color: var(--fg); padding: 0 .04em; }
.since { font-size: .94em; color: var(--mute); }
.live { font-size: 1em; }
.live i { width: .6em; }                  /* 时、分、秒每位一格，走字时整行纹丝不动 */
.live .sec { color: var(--gold); animation: ember .8s ease-out; }
@keyframes ember { from { color: #fffaea; } 30% { color: #ffe9a6; } }   /* 新的一秒先亮一下再回到铬黄，像星星闪一下；只动颜色，重绘很省 */

.next { display: flex; align-items: center; justify-content: center; gap: 1.1em; margin-top: .9em; }
.next p { display: flex; flex-direction: column; align-items: center; line-height: 1.45; }
.next .h { font-family: var(--zh); font-size: 1em; color: var(--fg); }
.next .h b { color: var(--gold); }
.next span { font-size: .86em; color: var(--mute); }
.next span b { color: var(--pale); }
.rule { width: 1px; height: 2.1em; background: linear-gradient(transparent, rgba(246, 201, 78, .55), transparent); }

/* ── 入场：名字 → 在一起的第 → 数字（滚动并落定）→ 天 → 小字 ── */
@keyframes rise { from { opacity: 0; transform: translateY(.45em); } }
@keyframes bloom { from { opacity: 0; transform: scale(.93); } }
.names { animation: rise 1.2s var(--ease) .45s both; }
.lead { animation: rise 1s var(--ease) .75s both; }
.digits { animation: bloom 1.6s var(--ease) .85s both; }
.unit { animation: rise .9s var(--ease) 1.6s both; }
.notes > * { animation: rise .8s var(--ease) 1.9s both; }
.notes > :nth-child(2) { animation-delay: 2s; }
.notes > :nth-child(3) { animation-delay: 2.1s; }

/* ── 大屏：稍放大，不让文字缩在一大片天空里 ── */
@media (min-width: 760px) and (min-height: 700px) {
  :root { --fs: min(2.3vh, 2.6vw, 24px); --D: min(50vh, 60vw, 520px); }
}
/* ── 手机横屏这类矮屏：一句话横排“在一起的第 N 天”，小字并成两行 ── */
@media (orientation: landscape) and (max-height: 560px) {
  :root { --fs: max(11.5px, min(3.3vh, 1.9vw, 17px)); --D: min(62vh, 34vw); }
  main { padding-top: max(8px, env(safe-area-inset-top, 0px)); }
  .card { width: min(100%, 46em); }
  .count { flex-direction: row; align-items: baseline; margin-top: 0 !important; }
  /* 方形的旋涡眼比数字宽：左右收进来，让“第”和“天”贴着数字 */
  .core { margin: calc(var(--D) * -.19) calc((var(--n) * .5 + .1) * var(--F) / 2 - var(--D) / 2); }
  .lead, .unit { font-size: 1.25em; }
  .lead { padding-left: 0; margin-right: .1em; letter-spacing: .32em; }
  .unit { margin-left: .5em; padding-left: 0; letter-spacing: 0; }
  .notes { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .2em 1.4em; margin-top: .6em; }
  .next { gap: .9em; margin-top: 0; flex-basis: 100%; }
  .next p { flex-direction: row; gap: .5em; align-items: baseline; }
  .rule { height: 1em; }
}
@media (prefers-reduced-motion: reduce) {
  .names, .lead, .digits, .unit, .notes > *, .live .sec { animation: none; }
}
/* 互动层的触摸约定：连点不触发双击放大，长按、拖动不选中文字；
   一屏放得下时（Fx 给 <html> 加 .fx-still）拖动整个交给页面，星尘才能一路跟着手指 */
main { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.fx-still main { touch-action: none; }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="lights" aria-hidden="true"></canvas>
<canvas id="land" aria-hidden="true"></canvas>
<canvas id="finish" aria-hidden="true"></canvas>

<main>
  <article class="card" id="card">
    <h1 class="names" id="names"></h1>
    <p class="count">
      <span class="sr" id="sr"></span>
      <span class="lead" aria-hidden="true">在一起的第</span>
      <span class="core" id="core" aria-hidden="true"><span class="digits"><span class="num shade" id="shade"></span><span class="num gold" id="days"></span></span></span>
      <span class="unit" aria-hidden="true">天</span>
    </p>
    <div class="notes">
      <p class="since" id="since"></p>
      <p class="live" id="live"></p>
      <div class="next" id="next"></div>
    </div>
  </article>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>

/* ═════ 只需要改这里 ═════ */
const CONFIG = {
  names: ['Paris', 'Henry'],
  start: [2026, 11, 1]           // 在一起的那天（算作第 1 天）：年, 月, 日
};

/* ── 公共：场景状态，各图层共用 ── */
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.random() * (b - a);
/* 可复现的随机数：同一个 seed 每次给出同一串数，窗口大小变化时画面不会重新洗牌 */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const Scene = {
  W: 0, H: 0, U: 0, dpr: 1,          // 视口宽高、短边、像素比（上限 2）
  t: 0,                              // 当前帧时间 ms
  age: 0,                            // 开场至今 ms（入场动画用；减弱动效时为 Infinity）
  day: 0, milestone: '',             // 今天是第几天；今天若是纪念日则是它的名字（由 UI 填写）
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
  quality: 1,                        // 1 = 全效果；帧率跟不上时 core 会逐步降到 .4
  core: { x: 0, y: 0, r: 0 },        // 大数字的中心与半径（主旋涡）
  box: { left: 0, top: 0, right: 0, bottom: 0 },   // 文字区域的外框
  horizon: 0,                        // 山脊线的大致高度 y
  stars: [], moon: null,             // 由 Lights.compose 填写
  pointer: { x: 0, y: 0, active: false },
  _h: {},
  on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); },
  emit(ev, d) { (this._h[ev] || []).forEach(f => f(d)); }
};

/* ── 文字：日期计算、入场时数字滚动、每秒走动的时钟 ── */
const UI = (() => {
  /* ── 日期 ── */
  const [SY, SM, SD] = CONFIG.start, DAY = 86400000;
  const startUTC = Date.UTC(SY, SM - 1, SD);
  const dateUTC = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const dayNo = d => Math.max(1, Math.round((dateUTC(d) - startUTC) / DAY) + 1);   // 起始日算第 1 天
  const pad = n => String(n).padStart(2, '0');
  const fig = n => `<b>${n}</b>`;                       // 数字一律用拉丁字体排，汉字用宋体
  const slots = v => [...String(v)].map(d => `<i>${d}</i>`).join('');   // 定宽格子：Fraunces 的数字不等宽，会变的数字一位一格
  const ZH = '〇一二三四五六七八九';
  const zhNum = n => n === 2 ? '两' : n < 10 ? ZH[n] : n < 20 ? '十' + (n % 10 ? ZH[n % 10] : '') : ZH[n / 10 | 0] + '十' + (n % 10 ? ZH[n % 10] : '');
  const SPECIAL = { 100: '百日', 520: '我爱你', 1314: '一生一世', 3344: '生生世世', 5200: '我爱你', 9999: '长长久久' };

  /* 已经过了几年几个月几天（按日历算），零的部分不写 */
  function ymd(now) {
    let y = now.getFullYear() - SY, m = now.getMonth() + 1 - SM, d = now.getDate() - SD;
    if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    if (y < 0) return '';
    return (y ? fig(y) + ' 年 ' : '') + (m ? fig(m) + ' 个月 ' : '') + (d ? fig(d) + ' 天 ' : '');
  }
  const nextMilestone = n => Math.min(...[30, 50, ...Object.keys(SPECIAL).map(Number), (Math.floor(n / 100) + 1) * 100].filter(x => x > n));
  function nextAnniversary(now) {
    let y = now.getFullYear();
    if (Date.UTC(y, SM - 1, SD) <= dateUTC(now)) y++;
    return { years: y - SY, left: Math.round((Date.UTC(y, SM - 1, SD) - dateUTC(now)) / DAY) };
  }
  /* 今天本身是不是纪念日：周年、特别的数字、整百天 */
  function todayLabel(now, n) {
    const years = now.getFullYear() - SY;
    if (years > 0 && now.getMonth() + 1 === SM && now.getDate() === SD) return zhNum(years) + '周年';
    return SPECIAL[n] || (n % 100 === 0 ? `第 ${n} 天` : '');
  }

  /* ── 显示 ── */
  let shown = 0, counting = false;
  const layers = () => [$('days'), $('shade')];          // 金色数字和垫在下面的深色那份，内容始终一样
  function showNum(v) { for (const el of layers()) el.textContent = v; }
  const col = (head, sub) => `<p><b class="h">${head}</b><span>${sub}</span></p>`;
  function newDay(now, n) {
    shown = n;
    const label = todayLabel(now, n), an = nextAnniversary(now), ms = nextMilestone(n);
    Scene.day = n; Scene.milestone = label;
    $('core').style.setProperty('--n', Math.max(2, String(n).length));   // 字号只跟最终位数有关，滚动时不跳
    $('sr').textContent = `在一起的第 ${n} 天`;
    if (!counting) showNum(n);
    // 第一栏：今天就是纪念日时写“就是今天”，否则写下一个；第二栏：下一个周年
    const first = label
      ? col(label.replace(/\d+/, fig), '就是今天')
      : col(`第 ${fig(ms)} 天`, `还有 ${fig(ms - n)} 天${SPECIAL[ms] ? ' · ' + SPECIAL[ms] : ''}`);
    $('next').innerHTML = first + '<i class="rule"></i>' + col(zhNum(an.years) + '周年', `还有 ${fig(an.left)} 天`);
  }
  function tick() {
    const now = new Date(), n = dayNo(now);
    if (n !== shown) newDay(now, n);
    // 每秒整行重写：秒数是新元素，它那一下微光动画随之重放
    $('live').innerHTML = `至今 ${ymd(now)}${fig(slots(pad(now.getHours())))} 时 ${fig(slots(pad(now.getMinutes())))} 分 <b class="sec">${slots(pad(now.getSeconds()))}</b> 秒`;
    setTimeout(tick, 1010 - now.getMilliseconds());     // 对齐到整秒，秒数换得均匀
  }

  /* 入场：数字从 0 滚到今天，越到后面越慢，像落定下来。
     滚动时每一位放进按最终那一位量好宽度的格子里，整串数字不会左右晃；落定后换回正常排版，位置不变 */
  function countUp() {
    if (Scene.reduced) return;
    counting = true;
    const to = shown, len = String(to).length, t0 = performance.now() + 900, dur = 1500 + 90 * len;
    for (const el of layers()) el.innerHTML = slots(to);
    const w = [...$('days').children].map(i => getComputedStyle(i).width);   // 只量这一次，不受入场缩放影响
    for (const el of layers()) [...el.children].forEach((i, k) => { i.style.width = w[k]; });
    (function step(t) {
      const p = Math.max(0, Math.min(1, (t - t0) / dur));
      const v = String(Math.round(to * (1 - Math.pow(1 - p, 2.6)))).padStart(len, ' ');
      for (const el of layers()) [...el.children].forEach((i, k) => { i.textContent = v[k].trim(); });
      if (p < 1) requestAnimationFrame(step); else { counting = false; showNum(shown); }
    })(performance.now());
  }

  let started = false;
  function init() {
    if (started) return; started = true;
    const [a, b] = CONFIG.names;
    $('names').innerHTML = `${a} <span class="amp">&amp;</span> ${b}`;
    const wk = '日一二三四五六'[new Date(SY, SM - 1, SD).getDay()];
    $('since').innerHTML = `始于 ${fig(SY)} 年 ${fig(SM)} 月 ${fig(SD)} 日 · 星期${wk}`;
    tick(); countUp();
    // 字体样式表是异步加载的（见 ui.head.html）；万一 onload 没执行，页面加载完再补一次
    addEventListener('load', () => document.querySelectorAll('link[data-font]').forEach(l => { l.media = 'all'; }));
  }

  /* 告诉其他图层：数字在哪、文字占了哪块。
     #core 与 #card 本身从不做动画（入场动画只在它们的子元素上），而且尺寸不依赖字体，
     所以任何时候量都是最终位置，字体换上来也不会变 */
  function measure() {
    const c = $('core').getBoundingClientRect(), b = $('card').getBoundingClientRect();
    return {
      core: { x: c.left + c.width / 2, y: c.top + c.height / 2, r: c.width / 2 },
      box: { left: b.left, top: b.top, right: b.right, bottom: b.bottom }
    };
  }
  return { init, measure };
})();

/* ── 星与月：柔和发光、带笔触的油画光晕，画在 #lights 上 ──
   每个光源在布局时画成一张小贴图（一层层颜色的柔光 + 顺着光晕走的软笔触 + 厚涂的亮核），
   每帧只把贴图合成上去：缓慢呼吸、各自闪烁、光晕随天空的旋涡极慢地转。 */
const Lights = (() => {
  const TAU = Math.PI * 2;
  /* 由星核向外的七层颜色：奶白 → 柠檬黄 → 铬黄 → 橙 → 淡绿 → 青白 → 蓝白 */
  const PAL = {
    gold:  ['#fffbe6', '#ffee9a', '#ffd43f', '#f7a521', '#d3e69a', '#98d6c8', '#a9d2ee'],
    lemon: ['#fffde9', '#fff4ac', '#f6e15e', '#e8bd3c', '#cbe6a4', '#94d9cb', '#aed6f0'],
    amber: ['#fff6d2', '#ffe07a', '#ffbf2e', '#f08a1a', '#dcd98a', '#93cfbe', '#a6cdee'],
    white: ['#ffffff', '#fdfce8', '#f4f2c0', '#ecd98a', '#c8ead2', '#a2dce6', '#bcdcf6'],
    moon:  ['#fff4c8', '#ffe27a', '#ffc93c', '#f39a1c', '#d9e696', '#98d4c4', '#acd4f0']
  };
  const CRESCENT = ['#ffb52e', '#ffc648', '#ffd76a', '#f79a1e', '#ec8213', '#ffbe3a'];
  /* 星位：[区, u, v, 大小, 性格]。按先后取用，放不下（挡字、太挤、被柏树遮住、离月亮太近）就跳过，
     所以同一张表适用于各种屏幕：小屏只取到前九个左右，大屏多取几个。
     T 顶部：x = u·W，y = v·顶部条带高；L / R 左右留白：u 从屏幕边量到文字边，y = v·山脊线；
     B 文字下方、山上方的一条。 */
  const SLOTS = [
    ['T', .11, .52, 1.15, 'gold'],      // 左上的大星
    ['L', .85, .62, 1.3, 'white'],      // 宽屏："长庚星"，低低地在柏树梢右边
    ['L', .55, .40, 1.3, 'white'],      // 窄屏：放到柏树上方的左边
    ['R', .45, .36, 1.0, 'gold'],
    ['R', .70, .50, 1.05, 'gold'],
    ['T', .41, .30, .6, 'lemon'],
    ['R', .15, .64, .75, 'lemon'],
    ['L', .80, .17, .62, 'lemon'],
    ['R', .75, .82, .9, 'amber'],
    ['T', .59, .68, .8, 'gold'],
    ['B', .72, .5, .6, 'amber'],
    ['L', .25, .26, .8, 'amber'],
    ['R', .25, .80, .7, 'gold'],
    ['R', .30, .14, .55, 'lemon'],
    ['L', .40, .05, .6, 'lemon'],
    ['R', .95, .30, .7, 'lemon'],
    ['L', .70, .38, .7, 'gold'],
    ['R', .10, .46, .6, 'amber'],
    ['L', .10, .44, .55, 'lemon'],
    ['R', .55, .95, .55, 'lemon'],
    ['T', .30, .80, .6, 'amber']
  ];
  let S, ctx, plan = [], lights = [], cache = new Map(), flare, clock = 0, due = 0;

  const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  /* 决定星星和月亮摆在哪（其他图层会读 scene.stars / scene.moon） */
  function compose(scene) {
    const { W, H, U, box, core, horizon } = scene, rand = rng(11);
    // 文字是居中的：外框太宽时，两侧各留 12% 当作可用的边
    const keep = { l: Math.max(box.left, W * .12), r: Math.min(box.right, W * .88), t: box.top, b: box.bottom };
    const gap = (x, y) => Math.hypot(Math.max(keep.l - x, 0, x - keep.r), Math.max(keep.t - y, 0, y - keep.b));
    // 月亮：右上；挡到文字就往角上挪
    const mr = U * .078, moon = { x: W - Math.max(mr * 2.2, W * .17), y: Math.max(mr * 1.85, H * .1), r: mr, halo: mr * 3.1 };
    for (let i = 0, x0 = moon.x, y0 = moon.y; i <= 20 && gap(moon.x, moon.y) < mr * 1.12; i++) {
      moon.x = x0 + (W - mr * 1.25 - x0) * i / 20; moon.y = y0 + (mr * 1.3 - y0) * i / 20;
    }
    const unit = 8.8 * Math.pow(U / 400, .85), cypress = Math.max(W * .24, 90);
    const want = Math.round(Math.min(13, Math.max(9, 5.5 + Math.sqrt(W * H) / 180)));   // 手机约九颗，大屏到十三颗
    const bandH = Math.max(keep.t, U * .2), stars = [];
    plan = [];
    SLOTS.forEach(([zone, u, v, k, kind], id) => {
      const seed = rand() * 6.3;                               // 每个星位都取一次随机数，星星增减时其余的不变
      if (stars.length >= want || (kind === 'white' && plan.some(p => p.kind === 'white'))) return;
      const r = unit * k, halo = r * (kind === 'white' ? 5 : 4.6), pad = r * 1.7 + 3;
      let x, y, clear = true;
      if (zone === 'T') { x = u * W; y = v * bandH; clear = gap(x, y) >= pad; }
      else if (zone === 'B') { x = keep.l + u * (keep.r - keep.l); y = (keep.b + pad + H * .8 - halo * .5) / 2; clear = gap(x, y) >= pad; }
      else {                                                   // 留白窄时，有的星会被屏幕边裁掉一点光晕，像画框外还有天
        const lo = r * .9, xin = lo + u * Math.max(0, (zone === 'L' ? keep.l : W - keep.r) - pad - lo);
        x = zone === 'L' ? xin : W - xin; y = v * horizon;
      }
      const ok = clear && y - r * 1.5 >= 2 && y + halo * .5 <= H * .8                          // 不出天空
        && Math.hypot(x - core.x, y - core.y) >= core.r + r * 1.5                              // 不进大数字的旋涡眼
        && !(x - r < cypress && y + r > H * .42)                                               // 不躲到柏树后面
        && Math.hypot(x - moon.x, y - moon.y) >= moon.halo * .72 + halo * .7
        && stars.every(s => Math.hypot(x - s.x, y - s.y) >= (halo + s.halo) * .72);
      if (!ok) return;
      stars.push({ x, y, r, halo, seed }); plan.push({ kind, id });
    });
    scene.stars = stars; scene.moon = moon;
  }

  /* ── 画贴图用的几种"笔" ── */
  /* 一团柔光：中心实、向外化开 */
  function blob(c, x, y, rad, col, a) {
    const g = c.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(.35, rgba(col, a * .78)); g.addColorStop(.68, rgba(col, a * .28)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fill();
  }
  /* 一圈柔和的色带：光晕里一层层的颜色 */
  function band(c, rad, w, col, a) {
    const g = c.createRadialGradient(0, 0, Math.max(0, rad - w), 0, 0, rad + w);
    g.addColorStop(0, rgba(col, 0)); g.addColorStop(.5, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, rad + w, 0, TAU); c.fill();
  }
  /* 几团略微错开的柔光叠在一起：轮廓不是正圆 */
  function lump(c, rand, n, off, rad, col, a) {
    for (let i = 0; i < n; i++) { const t = rand() * TAU, d = off * rand(); blob(c, Math.cos(t) * d, Math.sin(t) * d, rad * (.88 + .24 * rand()), col, a); }
  }
  /* 一笔：起笔处颜料厚、向后拖薄，边缘是软的；大一点的笔触上带一道笔毛的亮痕 */
  function dab(c, x, y, len, wid, ang, col, a, bristle) {
    c.save(); c.translate(x, y); c.rotate(ang); c.scale(1, wid / len);
    const g = c.createRadialGradient(len * .35, 0, 0, 0, 0, len);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(.55, rgba(col, a * .75)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, len, 0, TAU); c.fill();
    if (bristle) { c.fillStyle = rgba('#fffbe8', a * .45); c.fillRect(-len * .6, -len * .22, len * 1.1, len * .14); }
    c.restore();
  }
  /* 顺着光晕绕圈的笔触：半径随机（不排成整齐的圈），颜色由内向外从暖到冷 */
  function strokes(c, rand, p, from, to, halo, size, turn, n) {
    for (let i = 0; i < n; i++) {
      const q = from + (to - from) * Math.sqrt(rand()), t = rand() * TAU, rho = q * halo;
      const col = p[Math.min(6, Math.max(1, Math.round(1 + (q - from) / (to - from) * 4.6 + (rand() - .5) * 1.6)))];
      const len = Math.min(rho * .55, size * (1 + .9 * rand())), wid = size * (.3 + .18 * rand());
      dab(c, Math.cos(t) * rho, Math.sin(t) * rho, len, wid, t + Math.PI / 2 + turn + (rand() - .5) * .3, col, (.55 - .4 * q) * (.6 + .5 * rand()), len > 7);
    }
  }
  /* 画一张贴图：柔光部分分辨率封顶，省内存；月面要清楚，用满分辨率 */
  function sprite(half, paint, sharp) {
    const k = sharp ? S.dpr : Math.min(S.dpr, 192 / half), px = Math.ceil(half * k), cv = document.createElement('canvas');
    cv.width = cv.height = px * 2;
    const c = cv.getContext('2d'); c.setTransform(k, 0, 0, k, px, px);
    paint(c);
    return { cv, half: px / k };
  }

  /* 一颗星：冷色薄纱 → 淡绿 → 橙 → 铬黄 → 绕圈的笔触 → 厚涂的亮核 */
  function paintStar(c, L, rand) {
    const { r, halo } = L, p = PAL[L.kind], white = L.kind === 'white';
    c.rotate(rand() * TAU); c.scale(1, .9 + .1 * rand());      // 每颗星略扁一点、朝向不同
    lump(c, rand, 4, halo * .1, halo * .95, p[6], .09);
    band(c, halo * .7, halo * .2, p[5], .13);
    band(c, halo * .52, halo * .16, p[4], .2);
    band(c, halo * .37, halo * .13, p[3], white ? .12 : .26);
    lump(c, rand, 3, halo * .05, halo * .42, p[2], .42);
    lump(c, rand, 2, halo * .03, halo * .28, p[1], .55);
    strokes(c, rand, p, .24, .92, halo, r, L.spin * .18, Math.round(64 + halo / 3));
    // 亮核：铬黄的底，几笔绕着核心的短弧，再叠上奶白的厚颜料
    lump(c, rand, 3, r * .2, r * 2.1, p[2], .55);
    for (let i = 0; i < 7; i++) { const t = rand() * TAU, d = r * (1 + .4 * rand()); dab(c, Math.cos(t) * d, Math.sin(t) * d, r * .9, r * .38, t + Math.PI / 2, p[i % 2 + 1], .75, false); }
    for (let i = 0; i < 6; i++) { const t = rand() * TAU, d = r * .35 * rand(); dab(c, Math.cos(t) * d, Math.sin(t) * d, r * .95, r * .62, rand() * TAU, p[0], .9, false); }
    blob(c, 0, 0, r * 1.05, p[0], .85);
    blob(c, -r * .12, -r * .18, r * .5, '#ffffff', white ? 1 : .75);
  }

  /* 月晕：天上最大、最浓的一团光（不含月牙，方便单独转动） */
  function paintMoonHalo(c, L, rand) {
    const { r, halo } = L, p = PAL.moon;
    lump(c, rand, 5, halo * .06, halo * .97, p[6], .13);
    band(c, halo * .76, halo * .18, p[5], .16);
    band(c, halo * .6, halo * .15, p[4], .24);
    band(c, halo * .47, halo * .12, p[3], .3);
    lump(c, rand, 3, halo * .03, halo * .48, p[2], .45);
    lump(c, rand, 2, halo * .02, halo * .4, p[1], .7);
    strokes(c, rand, p, .38, .95, halo, r * .34, L.spin * .14, 150);
    blob(c, 0, 0, r * 1.5, p[0], .5);
  }
  /* 月面：月牙怀里一团淡黄的光 + 橙金色的月牙，月牙上顺着弧线有笔毛的痕迹 */
  function paintMoonDisc(c, L, rand) {
    const R = L.r, d = R * .5, q = R * .84;
    c.rotate(-.32);
    const x0 = (d * d + R * R - q * q) / (2 * d), y0 = Math.sqrt(R * R - x0 * x0), al = Math.atan2(y0, x0), be = Math.atan2(y0, x0 - d);
    const f1 = rand() * TAU, f2 = rand() * TAU, wob = a => 1 + .016 * Math.sin(a * 5 + f1) + .011 * Math.sin(a * 9 + f2);
    blob(c, d * .8, 0, q * 1.12, '#f8eea0', .8);
    for (let i = 0; i < 10; i++) { const t = rand() * TAU, k = q * (.2 + .55 * rand()); dab(c, d + Math.cos(t) * k, Math.sin(t) * k, R * .3, R * .1, t + Math.PI / 2, i % 2 ? '#fff6c2' : '#e2eaa2', .45, false); }
    c.save();
    c.beginPath();
    for (let i = 0; i <= 48; i++) { const a = al + (TAU - 2 * al) * i / 48, k = R * wob(a); c.lineTo(Math.cos(a) * k, Math.sin(a) * k); }
    for (let i = 0; i <= 48; i++) { const a = TAU - be - (TAU - 2 * be) * i / 48, k = q * wob(a + 2); c.lineTo(d + Math.cos(a) * k, Math.sin(a) * k); }
    c.closePath(); c.clip();
    const g = c.createLinearGradient(-R, -R * .7, R * .2, R);
    g.addColorStop(0, '#ffc63e'); g.addColorStop(.5, '#fbaa24'); g.addColorStop(1, '#ea8414');
    c.fillStyle = g; c.fillRect(-R * 1.1, -R * 1.1, R * 2.2, R * 2.2);
    c.lineCap = 'round';
    for (let i = 0; i < 54; i++) {                              // 笔触：夹在内外两条弧之间的一族圆弧
      const f = rand(), rad = R + (q - R) * f, mid = Math.PI + (rand() - .5) * 3.6, span = .16 + .34 * rand();
      c.globalAlpha = .35 + .4 * rand(); c.strokeStyle = CRESCENT[Math.floor(rand() * 6)]; c.lineWidth = R * (.05 + .07 * rand());
      c.beginPath(); c.arc(d * f, 0, rad, mid - span, mid + span); c.stroke();
      c.globalAlpha *= .5; c.strokeStyle = '#fff0b4'; c.lineWidth = R * .018;      // 厚涂：笔触上缘的一线亮
      c.beginPath(); c.arc(d * f - R * .02, -R * .025, rad, mid - span * .8, mid + span * .6); c.stroke();
    }
    c.globalAlpha = 1; c.restore();
    c.lineCap = 'round'; c.lineWidth = R * .05; c.strokeStyle = rgba('#fff3b0', .55);       // 外缘受光的一笔
    c.beginPath(); c.arc(0, 0, R * .965, Math.PI * .95, Math.PI * 1.5); c.stroke();
    c.strokeStyle = rgba('#d46f0e', .4);                                                   // 下缘压一笔深橙
    c.beginPath(); c.arc(0, 0, R * .965, Math.PI * .42, Math.PI * .86); c.stroke();
  }

  function init(scene) {
    S = scene; ctx = $('lights').getContext('2d');
    const old = cache; cache = new Map();
    const make = (key, half, paint, sharp) => { key += '|' + S.dpr; const sp = old.get(key) || sprite(half, paint, sharp); cache.set(key, sp); return sp; };
    flare = make('flare', 24, c => blob(c, 0, 0, 24, '#fff8dc', 1));
    // 入场次序：从长庚星（没有就从左下）开始，一颗颗亮过去，月亮最后
    const first = S.stars[plan.findIndex(p => p.kind === 'white')] || { x: 0, y: S.H };
    const order = S.stars.map((s, i) => [Math.hypot(s.x - first.x, s.y - first.y), i]).sort((a, b) => a[0] - b[0]).map(e => e[1]);
    lights = S.stars.map((s, i) => {
      const { kind, id } = plan[i], rand = rng(977 + id * 131), spin = i % 2 ? 1 : -1;      // 与天空的旋向一致：奇数顺时针
      const L = { ...s, kind, spin, born: 300 + 1050 * order.indexOf(i) / Math.max(1, S.stars.length) };
      L.glow = make([kind, id, s.r.toFixed(2), spin].join(), s.halo * 1.08 + 2, c => paintStar(c, L, rand));
      return L;
    });
    const m = S.moon, rand = rng(4201), M = { ...m, kind: 'moon', spin: -1, seed: 1.7, born: 1300 };
    M.glow = make('moonHalo' + m.r.toFixed(2), m.halo * 1.06 + 2, c => paintMoonHalo(c, M, rand));
    M.disc = make('moonDisc' + m.r.toFixed(2), m.r * 1.5, c => paintMoonDisc(c, M, rand), true);
    lights.push(M);
    for (const L of lights) {                                   // 各有各的节奏
      const r = rng(31 + Math.round(L.seed * 1000));
      L.w1 = TAU / (5200 + 4200 * r()); L.w2 = TAU / (1700 + 1500 * r()); L.w3 = TAU / (2900 + 2600 * r()); L.turn = L.spin * TAU / (70000 + 50000 * r());
    }
    paint();
  }

  function put(sp, x, y, scale, rot, alpha) {
    const k = scale * S.dpr, co = Math.cos(rot) * k, si = Math.sin(rot) * k;
    ctx.setTransform(co, si, -si, co, x * S.dpr, y * S.dpr); ctx.globalAlpha = alpha;
    ctx.drawImage(sp.cv, -sp.half, -sp.half, sp.half * 2, sp.half * 2);
  }
  function paint() {
    const age = S.age;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, S.W * S.dpr, S.H * S.dpr);
    for (const L of lights) {
      const k = clamp01((age - L.born) / 550), lit = k * k * (3 - 2 * k);                    // 入场：由暗到亮
      const breath = Math.sin(clock * L.w1 + L.seed);
      put(L.glow, L.x, L.y, (.9 + .1 * lit) * (1 + .03 * breath), clock * L.turn, (.5 + .5 * lit) * (.93 + .07 * breath));
      if (L.disc) { put(L.disc, L.x, L.y, 1, 0, .7 + .3 * lit); continue; }
      const tw = Math.max(0, Math.sin(clock * L.w2 + L.seed * 2) * Math.sin(clock * L.w3 + L.seed * 3));
      ctx.globalCompositeOperation = 'lighter';                 // 星核的一点闪烁；刚亮起时闪一下
      put(flare, L.x, L.y, L.r * .085 * (1 + .5 * tw), 0, lit * (.12 + .3 * tw) + .5 * Math.sin(k * Math.PI));
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  /* 星光动得极慢：入场时每帧都画，之后约 16 次/秒就足够平滑，省下手机上整张画布的光栅化 */
  function frame(t, dt) {
    clock += dt; due -= dt;
    if (S.age < 2200 || due <= 0) { paint(); due = 60; }
  }
  return { compose, init, frame };
})();

/* ── 前景：山丘、小镇、教堂、柏树。油彩只在布局时画一次；每帧只动窗里的灯火和柏树梢 ── */
const Land = (() => {
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const p = rgb(a), q = rgb(b); return 'rgb(' + p.map((v, i) => Math.round(v + (q[i] - v) * k)).join(',') + ')'; };
  /* 一种颜料 = [本色, 受光一侧的鬃毛纹, 背光一侧的鬃毛纹] */
  const ink = (h, hi = '#dce9fb', k = .3) => [h, mix(h, hi, k), mix(h, '#03061a', .45)];
  const inks = (list, hi, k) => list.map(h => ink(h, hi, k));

  /* 调色盘：每组由暗到亮 */
  const FAR = inks(['#24397f', '#2c4792', '#3556a4', '#4258a6', '#4470b8', '#6088c8'], '#dce9fb', .24);     // 最远的山：偏浅、偏蓝紫
  const MID = inks(['#16225f', '#1b2c76', '#22398c', '#2e3588', '#2a4aa2', '#3b62b4'], '#dce9fb', .22);     // 中间：群青
  const NEAR = inks(['#0c1f3a', '#0f2b48', '#123a54', '#17335f', '#1a4e60', '#23686a'], '#cfeee6', .2);     // 近处：深青
  const GROVE = inks(['#08161f', '#0a2029', '#0d2b33', '#103536', '#15423f', '#1d544c'], '#bfe6d8', .2);    // 村后的树丛、近处的灌木
  const FIELD = inks(['#060d1c', '#081424', '#0a1b2c', '#0c2431', '#0e1a36', '#113038'], '#a8d0d8', .16);   // 最前面的田野
  const GLINT = inks(['#7fa3dc', '#9dbde8', '#7cc4cf', '#b4cdee']);                                          // 接住月光的几笔
  const LINE = ink('#090e2e', '#5a78c0', .25);                                                               // 勾山脊、勾房子的深线
  const WALL = inks(['#22315f', '#2a3a6e', '#30447e', '#384f8c', '#42599a', '#4f68a8'], '#dfe8fa', .24);
  const ROOF = inks(['#131b40', '#18254e', '#1e3258', '#263566', '#172f48'], '#c8d8f4', .2);
  const LEAF = inks(['#09171a', '#0c2420', '#113026', '#163f30', '#1f4e38'], '#c8d890', .22);               // 村里的树
  const BLACK = inks(['#050a0b', '#08100f', '#090f14', '#0b1611'], '#6d7040', .22);                          // 柏树：近黑的绿
  const UMBER = inks(['#1a1209', '#24180d', '#2e1f10', '#382614'], '#98804a', .2);                         // 柏树：棕褐

  /* 柏树：一团向上舔的深色火焰。先铺近黑的底，再用一条条从里向外、向上卷起的长笔触织出来，像一束束火舌 */

  const sized = (cv, w, h) => { cv = cv || document.createElement('canvas'); cv.width = w; cv.height = h; return cv; };

      holding = strong && still > .3 && p.y < S.horizon;
    }
    held += ((holding ? 1 : 0) - held) * Math.min(1, s * 5);
    if (holding) for (drip += s * 8 * S.quality; drip >= 1; drip--) mote(p.x + R(-10, 10), p.y + R(-12, 4), 1, R(26, 46));
  }

  /* 流星：其实是一道很快画过去的笔触，起笔饱满，越拖越干。挑一条不压住大数字、尽量少碰文字的路线，只走上半天空 */
  function comet() {
    const { W, H, U, core, box } = S;
    let best, low = Infinity;
    for (let i = 0; i < 8; i++) {
      const dir = Math.random() < .7 ? 1 : -1, len = Math.min(320, Math.max(130, U * R(.34, .5))), tilt = R(.26, .66);
      const x = W * (.5 - dir * R(.02, .44)), y = H * R(.03, .25), ang = dir > 0 ? tilt : Math.PI - tilt;
      let score = Math.random();
      for (let j = 0; j <= 4; j++) {
        const qx = x + Math.cos(ang) * len * j / 4, qy = y + Math.sin(ang) * len * j / 4;
        if (qx > box.left && qx < box.right && qy > box.top && qy < box.bottom) score += 1;
        if (Math.hypot(qx - core.x, qy - core.y) < core.r) score += 9;
        if (qx < 0 || qx > W || qy > H * .42) score += 4;
      }
      if (score < low) { low = score; best = { x, y, ang, len }; }
    }
    const life = R(.6, .85);
    comets.push({ ...best, v: best.len / life, life, age: 0, run: 0, turn: R(-.45, .45), size: Math.max(20, Math.min(30, U * .055)) });
  }
  /* 日程：流星每隔十几秒一颗；纪念日头几秒从上空落一阵金屑，多三颗流星，然后归于平静 */
  function ambient(s) {
    const age = S.age;
    if (S.milestone !== seen) { seen = S.milestone; if (seen) { fete = Math.max(age, 1500); extra = 3; nextStar = fete + R(17000, 26000); } }
    const u = (age - fete) / 1000;
    if (u >= 0 && u < 9) {
      shower += s * 10 * Math.min(2.4, Math.max(1, S.W / 400)) * S.quality * Math.min(1, u / 1.2, (9 - u) / 3.5);
      for (; shower >= 1; shower--) {                                     // 金屑里夹几片玫瑰色的小心，像花瓣
        const petal = Math.random() < .14, r = Math.random();
        add({ spr: petal ? HEART + (r < .6 ? 0 : 3) : dab(r < .5 ? 0 : r < .75 ? 1 : r < .9 ? 2 : 4), x: R(0, S.W), y: R(-14, S.H * .3), rise: -R(38, 62), sway: R(12, 26), flow: 12, ang: R(0, 6.3), spin: R(-1.2, 1.2) * (petal ? .5 : 1), wob: petal ? .5 : 0, size: petal ? R(15, 20) : R(12, 18), life: R(5.5, 8), fadeIn: .6, hold: .55, a: .88, soft: true });
      }
      if (extra && u > 9.4 - extra * 2.3) { comet(); extra--; }
    }
    if (age >= nextStar) { comet(); nextStar = age + R(10000, 25000); }
  }

  function init(scene) {
    S = scene; ctx = $('fx').getContext('2d'); ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    n = 0; comets.length = 0; x0 = y0 = Infinity; x1 = y1 = -Infinity; px = NaN;
    if (S.reduced) return;                       // 减弱动效：什么都不画，也不响应点按
    paintAtlas();
    const rand = rng(29), count = Math.max(2, Math.min(4, Math.round(S.W / 200)));
    flies.length = 0;                            // 萤火虫：各守着山丘、小镇上空的一小块地方
    for (let i = 0; i < count; i++) flies.push({ x: S.W * (.16 + .8 * rand()), y: S.H * (.815 + .105 * rand()), ph: rand() * 6.3, f: .55 + rand() * .45 });
    /* 一屏放得下时，把拖动整个交给页面（见 fx.css），否则浏览器会把它当成滚动，拖几像素就取消指针事件 */
    const main = document.querySelector('main');
    document.documentElement.classList.toggle('fx-still', !!main && main.scrollHeight <= main.clientHeight + 1);
    if (bound) return; bound = true;
    Scene.on('tap', tap);
    /* scene.pointer 不分触摸和鼠标，这里补记一下：手指、或按着键的鼠标才算“划”，光是鼠标路过不算 */
    const note = e => { strong = e.pointerType === 'touch' || e.buttons > 0; };
    for (const ev of ['pointerdown', 'pointermove', 'pointerup']) addEventListener(ev, note, { passive: true });
  }

  function frame(t, dt) {
    if (S.reduced) return;
    const s = dt / 1000, d = S.dpr, { core, horizon, box } = S;
    heat *= Math.exp(-s / .9);
    ambient(s); trail(s);
    if (x1 > x0) {                               // 只擦上一帧画过的那一块；什么都没画过就什么都不做
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.clearRect(x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 4);
      x0 = y0 = Infinity; x1 = y1 = -Infinity;
    }
    /* 萤火虫：慢慢游荡，每隔十来秒亮两三秒；暗的时候不画，画布也就不用动 */
    for (let i = Math.ceil(flies.length * S.quality); i-- && S.age > 2500;) {
      const f = flies[i], th = t * .001 * f.f, b = (Math.sin(th * .8 + f.ph * 3) - .7) / .3;
      if (b > 0) blit(LIGHT + 3, f.x + Math.sin(th * .37 + f.ph) * 26 + Math.sin(th * .83 + f.ph * 2) * 9, f.y + Math.sin(th * .53 + f.ph * 1.7) * 11, 15, b * b * (3 - 2 * b) * .85, 1, 0);
    }
    /* 流星：沿略弯的路线前进，一路留下颜料点，越到后面越细、越疏 */
    for (let i = comets.length; i--;) {
      const c = comets[i], k = (c.age += s) / c.life;
      if (k >= 1) { comets.splice(i, 1); continue; }
      const step = c.v * (1.3 - .6 * k) * s, co = Math.cos(c.ang += c.turn * s), si = Math.sin(c.ang), gap = c.size * (.36 + .5 * k);
      c.x += co * step; c.y += si * step;
      for (c.run += step; c.run >= gap; c.run -= gap) {
        add({ spr: dab(Math.random() < .5 - .3 * k ? 1 : Math.random() < .8 ? 0 : 2), x: c.x - co * c.run, y: c.y - si * c.run, vx: co * 26, vy: si * 26, drag: 3, flow: 0, ang: c.ang, size: c.size * (1.15 - .6 * k), life: R(.4, .56), fadeIn: .03, hold: .15, a: .95 - .35 * k, soft: true });
        if (Math.random() < .4) add({ spr: LIGHT + (Math.random() < .5 ? 1 : 2), x: c.x - co * c.run + R(-5, 5), y: c.y - si * c.run + R(-5, 5), flow: 8, size: R(9, 14), life: R(.4, .8), hold: .2, a: .8, tw: .5, soft: true });
      }
      blit(LIGHT + 1, c.x, c.y, c.size * 1.9, Math.pow(Math.sin(Math.PI * k), .5), 1, 0);
    }
    /* 粒子：初速很快散掉，之后跟着天空的气流走（自左向右的风，绕着大数字顺时针打转），柔和地淡出 */
    const r2 = core.r * core.r * .384, g = 3.8 * core.r * .62;
    let j = 0;
    for (let i = 0; i < n; i++) {
      const p = pool[i], k = (p.age += s) / p.life;
      if (k >= 1) continue;
      if (i !== j) { pool[i] = pool[j]; pool[j] = p; }
      j++;
      const ex = p.x - core.x, ey = p.y - core.y, w = g * Math.exp(-(ex * ex + ey * ey) / r2 * .5) / r2;
      const wx = 1 - w * ey, wy = .22 * Math.sin(p.x * .008 + p.y * .005 + t * .0002) + w * ex, wm = p.flow / (Math.hypot(wx, wy) || 1) * Math.min(2, .55 + .45 * Math.hypot(wx, wy));
      const e = Math.exp(-p.drag * s);
      p.vx *= e; p.vy *= e;
      const ux = p.vx + wx * wm + Math.sin(p.age * 2.1 + p.ph) * p.sway, uy = p.vy + wy * wm - p.rise;
      p.x += ux * s; p.y += uy * s;
      let a = p.a * Math.min(1, p.age / p.fadeIn) * (k < p.hold ? 1 : .5 + .5 * Math.cos(Math.PI * (k - p.hold) / (1 - p.hold)));
      if (p.tw) a *= 1 - p.tw * (.5 + .5 * Math.sin(p.age * 9 + p.ph * 7));
      if (!p.fly) a *= Math.min(1, Math.max(0, (horizon - p.y) / 24));                                   // 地平线以下只留萤火
      if (p.x > box.left && p.x < box.right && p.y > box.top && p.y < box.bottom) a *= p.soft ? .55 : .75;   // 经过文字时更淡，久留的更淡
      if (a < .012) continue;
      const sz = p.size * (1 + p.grow * k) * (p.pop ? Math.min(1, .4 + p.age * 2.4) : 1);
      if (p.spr >= LIGHT) { blit(p.spr, p.x, p.y, sz, a, 1, 0); continue; }
      const ang = p.follow ? Math.atan2(uy, ux) : p.ang + p.spin * p.age + Math.sin(p.age * 2.4 + p.ph) * p.wob;
      blit(p.spr, p.x, p.y, sz, a, Math.cos(ang), Math.sin(ang));
    }
    n = j;
    if (held > .02) blit(LIGHT, S.pointer.x, S.pointer.y, 78 + 6 * Math.sin(t * .004), held * .34, 1, 0);
    ctx.globalAlpha = 1;
  }
  return { init, frame };
})();

/* ── 总控：排版、主循环、指针、帧率保护 ── */
(() => {
  const mods = { Sky, Lights, Land, Finish, Fx };          // 由下到上的绘制顺序
  const names = Object.keys(mods), S = Scene;
  const prof = window.__PROF ? {} : null;                  // 调试用：统计每层每帧耗时
  let lastW = 0, lastH = 0, last = 0, t0 = 0, ema = 16, slow = 0, timer = 0;

  function layout(force) {
    const W = innerWidth, H = innerHeight;
    if (!force && W === lastW && Math.abs(H - lastH) < 120) return;   // 手机地址栏伸缩时不重排
    lastW = W; lastH = H;
    S.W = W; S.H = H; S.U = Math.min(W, H); S.dpr = Math.min(devicePixelRatio || 1, 2);
    for (const id of ['sky', 'lights', 'land', 'finish', 'fx']) { const c = $(id); c.width = Math.round(W * S.dpr); c.height = Math.round(H * S.dpr); }
    Object.assign(S, UI.measure());
    S.horizon = H * .83;
    Lights.compose(S);
    for (const n of names) mods[n].init(S);
    if (S.reduced) { S.age = Infinity; for (const n of names) mods[n].frame(0, 16); }
  }
  function loop(t) {
    const raw = t - last || 16, dt = Math.min(50, raw); last = t; S.t = t; S.age = t - (t0 = t0 || t);
    for (const n of names) {
      if (!prof) { mods[n].frame(t, dt); continue; }
      const a = performance.now(); mods[n].frame(t, dt);
      const p = prof[n] = prof[n] || { sum: 0, n: 0, max: 0 }, d = performance.now() - a; p.sum += d; p.n++; p.max = Math.max(p.max, d);
    }
    if (!prof && raw < 200) {                               // 连续卡顿就降一档画质，只降不升
      ema += (raw - ema) * .05;
      slow = ema > 24 ? slow + 1 : 0;
      if (slow > 90 && S.quality > .4) { S.quality = Math.max(.4, S.quality - .15); slow = 0; ema = 16; S.emit('quality', S.quality); }
    }
    requestAnimationFrame(loop);
  }
  if (prof) window.__prof = () => Object.fromEntries(Object.entries(prof).map(([k, p]) => [k, { avg: +(p.sum / p.n).toFixed(2), max: +p.max.toFixed(1) }]));

  addEventListener('pointermove', e => { S.pointer.x = e.clientX; S.pointer.y = e.clientY; S.pointer.active = true; });
  addEventListener('pointerdown', e => {
    S.pointer.x = e.clientX; S.pointer.y = e.clientY; S.pointer.active = true;
    if (!e.target.closest('a, button')) S.emit('tap', { x: e.clientX, y: e.clientY });
  });
  for (const ev of ['pointerleave', 'pointercancel', 'pointerup']) addEventListener(ev, e => { if (ev !== 'pointerup' || e.pointerType !== 'mouse') S.pointer.active = false; });
  document.addEventListener('mouseleave', () => { S.pointer.active = false; });
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(layout, 160); });

  UI.init();
  layout(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
  if (!S.reduced) requestAnimationFrame(loop);
})();
</script>

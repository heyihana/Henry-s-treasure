<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris & Henry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：一屏。整块画布是会流动的星月夜笔触，数字是旋涡的中心；
   底部一层静态剪影（山丘、小镇、柏树），文字居中叠在天空上。 */
:root {
  color-scheme: dark;
  --sky: #0d1b4b;            /* 普鲁士蓝夜空 */
  --sky-deep: #070d26;       /* 山丘与阴影 */
  --fg: #fdf6d8;             /* 月光白 */
  --muted: #b9c8ee;          /* 淡钴蓝 */
  --gold: #ffd95a;           /* 星与月 */
  --amber: #f6a623;
  --chip: rgba(7, 13, 38, .55); --line: rgba(255, 217, 90, .35);
  --font-num: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
  --font-zh: "Noto Serif SC", "Songti SC", "PingFang SC", serif;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--fg);
  font-family: var(--font-zh); -webkit-tap-highlight-color: transparent;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

main {
  position: fixed; inset: 0; overflow-y: auto; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(17vh + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  max-width: 100%; text-align: center;
  text-shadow: 0 1px 14px rgba(5, 10, 34, .95), 0 0 3px rgba(5, 10, 34, .8);
  animation: rise 1.1s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

h1 {
  margin: 0; font-family: var(--font-num); font-style: italic; font-weight: 500;
  font-size: clamp(34px, 10vw, 54px); line-height: 1.05; letter-spacing: .01em; color: var(--fg);
}
h1 em { font-style: italic; color: var(--gold); padding: 0 .12em; }
.lead, .unit { font-size: clamp(15px, 4.2vw, 19px); letter-spacing: .5em; text-indent: .5em; color: var(--muted); }
.core {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: min(86vw, 46vh, 440px); aspect-ratio: 1; margin-block: -6px;
  background: radial-gradient(closest-side, rgba(7, 13, 38, .72), rgba(7, 13, 38, .4) 55%, transparent);
}
.num {
  --n: 2;
  display: flex; justify-content: center;
  font-family: var(--font-num); font-weight: 300; line-height: .95;
  font-size: min(clamp(120px, 42vw, 250px), calc(78vw / (var(--n) * .5)));
  font-variant-numeric: lining-nums tabular-nums;
  background: linear-gradient(180deg, #fffbe6 15%, var(--gold) 60%, var(--amber));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: none; filter: drop-shadow(0 0 26px rgba(255, 205, 80, .55));
}
.since { font-size: clamp(13px, 3.6vw, 16px); color: var(--muted); letter-spacing: .08em; }
.live { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 10px; font-size: clamp(15px, 4.2vw, 19px); }
.clock { font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 1.25em; color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; text-shadow: none; }
.chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; background: var(--chip); border: 1px solid var(--line); }
.chip b { font-weight: 600; color: var(--gold); }

@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="land" aria-hidden="true"></canvas>

<main>
  <section class="card">
    <h1 id="names"></h1>
    <div class="lead">在一起的第</div>
    <div class="core" id="core">
      <div class="num" id="days"></div>
      <div class="unit">天</div>
    </div>
    <div class="since" id="since"></div>
    <div class="live"><span id="ymd"></span><span class="clock" id="clock" aria-hidden="true"></span></div>
    <div class="chips" id="chips"></div>
  </section>
</main>

<script>
/* ═════ 只需要改这里 ═════ */
const CONFIG = {
  names: ['Paris', 'Henry'],
  start: [2026, 11, 1]           // 在一起的那天（算作第 1 天）：年, 月, 日
};
/* ═══════════════════════ */

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = (a, b) => a + Math.random() * (b - a);

/* ── 日期 ── */
const [SY, SM, SD] = CONFIG.start, DAY = 86400000;
const startUTC = Date.UTC(SY, SM - 1, SD);
const todayUTC = n => Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
const dayNo = n => Math.round((todayUTC(n) - startUTC) / DAY) + 1;
function elapsed(now) {
  let y = now.getFullYear() - SY, m = now.getMonth() + 1 - SM, d = now.getDate() - SD;
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return [y && y + ' 年', m && m + ' 个月', d + ' 天'].filter(Boolean).join(' ');
}
const SPECIAL = { 100: '百日', 520: '我爱你', 1314: '一生一世', 3344: '生生世世', 5200: '我爱你', 9999: '长长久久' };
function nextMilestone(n) {
  const c = [30, 50, ...Object.keys(SPECIAL).map(Number), (Math.floor(n / 100) + 1) * 100];
  return Math.min(...c.filter(x => x > n));
}
function nextAnniversary(now) {
  let y = now.getFullYear();
  if (Date.UTC(y, SM - 1, SD) <= todayUTC(now)) y++;
  return { years: y - SY, left: Math.round((Date.UTC(y, SM - 1, SD) - todayUTC(now)) / DAY) };
}
const pad = n => String(n).padStart(2, '0');
let shown = -1, counting = false;
function showNum(n) { const s = String(n); $('days').textContent = s; $('days').style.setProperty('--n', Math.max(2, s.length)); }
function tick() {
  const now = new Date(), n = dayNo(now);
  if (n !== shown) {
    shown = n;
    if (!counting) showNum(n);
    $('ymd').textContent = '已经相伴 ' + elapsed(now);
    const ms = nextMilestone(n), an = nextAnniversary(now);
    $('chips').innerHTML =
      `<span class="chip">第 <b>${ms}</b> 天${SPECIAL[ms] ? ' · ' + SPECIAL[ms] : ''} · 还有 ${ms - n} 天</span>` +
      `<span class="chip"><b>${an.years}</b> 周年 · 还有 ${an.left} 天</span>`;
  }
  $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
function countUp() {
  if (reduced) return;
  counting = true;
  const t0 = performance.now(), dur = 1800;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    showNum(Math.round(shown * e));
    if (p < 1) requestAnimationFrame(step); else counting = false;
  })(t0);
}

/* ── 星月夜：沿旋涡流动的笔触 ── */
const cv = $('sky'), ctx = cv.getContext('2d'), land = $('land'), lctx = land.getContext('2d');
const BLUES = ['#1d3f94', '#2b5fc0', '#4f86d9', '#8fb8ee', '#16306f', '#c9def5', '#2f6fb5', '#3a9bb8'];
const GOLDS = ['#ffe27a', '#ffc93c', '#fff3b8', '#f6a623', '#ffe9a0'];
const STARS = [[.1, .07, 1], [.4, .04, .7], [.63, .12, .85], [.93, .33, 1.1], [.06, .31, .8], [.94, .6, .75], [.05, .62, .95], [.27, .17, .6], [.7, .78, .6]];
let W = 0, H = 0, U = 0, strokes = [], vort = [], stars = [], moon = null, moonImg = null, bursts = [], frameNo = 0;

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H);
  for (const c of [cv, land]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  ctx.fillStyle = '#0d1b4b'; ctx.fillRect(0, 0, W, H);

  stars = STARS.map(([x, y, k]) => ({ x: x * W, y: y * H, r: U * .022 * k, p: R(0, 6.3) }));
  moon = { x: W * .83, y: H * .1, r: U * .075 };
  const core = $('core').getBoundingClientRect();
  vort = [
    { x: core.left + core.width / 2, y: core.top + core.height / 2, r: core.width * .62, s: 1.6, core: true },
    { x: W * .72, y: H * .7, r: U * .26, s: -1.3 },
    { x: W * .2, y: H * .47, r: U * .2, s: 1.1 },
    { x: moon.x, y: moon.y, r: moon.r * 3, s: -1.5, gold: true },
    ...stars.map((s, i) => ({ x: s.x, y: s.y, r: s.r * 4.6, s: i % 2 ? 1.4 : -1.4, gold: true }))
  ];
  strokes = [];
  for (let i = 0, n = Math.min(2200, Math.max(900, W * H / 420)); i < n; i++) strokes.push(newStroke());

  // 弯月：离屏画好再贴上去
  const m = document.createElement('canvas'), mr = moon.r * dpr; m.width = m.height = mr * 2;
  const mc = m.getContext('2d');
  mc.fillStyle = '#ffb52e'; mc.beginPath(); mc.arc(mr, mr, mr * .95, 0, 6.3); mc.fill();
  mc.globalCompositeOperation = 'destination-out';
  mc.beginPath(); mc.arc(mr * 1.42, mr * .86, mr * .86, 0, 6.3); mc.fill();
  moonImg = m;
  paintLand();
  if (reduced) { for (let i = 0; i < 160; i++) step(i * 16, false); step(0, true); }
}
function newStroke() {
  return { x: R(0, W), y: R(0, H * .9), w: R(1.4, 3.6), sp: R(.9, 2), c: Math.floor(R(0, 40)), life: Math.floor(R(0, 240)) };
}
function step(t, tops = true) {
  frameNo++;
  ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(13,27,75,.06)'; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  for (const p of strokes) {
    let vx = .55, vy = .3 * Math.sin(p.x * .006 + p.y * .004 + t * .00015), gold = 0, dim = 0;
    for (const v of vort) {
      const dx = p.x - v.x, dy = p.y - v.y, d = Math.hypot(dx, dy) + .01, q = d / v.r;
      if (q > 2.2) continue;
      const g = Math.exp(-q * q) * 3;
      vx += (-dy / d * v.s + dx / d * (.6 - q) * .5) * g;
      vy += (dx / d * v.s + dy / d * (.6 - q) * .5) * g;
      if (v.gold && q < .95) gold = 1;
      if (v.core && q < .55) dim = 1;
    }
    const m = p.sp / (Math.hypot(vx, vy) || 1), nx = p.x + vx * m, ny = p.y + vy * m;
    if (p.life % 46 < 30) {                      // 断续落笔，像一道道短笔触
      ctx.globalAlpha = dim ? .28 : .9;
      ctx.strokeStyle = gold ? GOLDS[p.c % GOLDS.length] : BLUES[p.c % BLUES.length];
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
    }
    p.x = nx; p.y = ny;
    if (++p.life > 420 || nx < -10 || nx > W + 10 || ny < -10 || ny > H + 10) Object.assign(p, newStroke(), { life: 0 });
  }
  if (!tops) return;
  ctx.globalAlpha = 1;
  for (const s of stars) {
    const r = s.r * (2.3 + .35 * Math.sin(t * .002 + s.p));
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, '#fffdf0'); g.addColorStop(.3, 'rgba(255,224,110,.95)'); g.addColorStop(1, 'rgba(255,200,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.3); ctx.fill();
  }
  const mg = ctx.createRadialGradient(moon.x, moon.y, moon.r * .5, moon.x, moon.y, moon.r * 2);
  mg.addColorStop(0, 'rgba(255,214,90,.5)'); mg.addColorStop(1, 'rgba(255,214,90,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r * 2, 0, 6.3); ctx.fill();
  ctx.drawImage(moonImg, moon.x - moon.r, moon.y - moon.r, moon.r * 2, moon.r * 2);
  for (const b of bursts) {
    b.x += b.vx; b.y += b.vy; b.vy += .05; b.life -= .014;
    const s = b.s * (.6 + .4 * b.life);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.vx * .15);
    ctx.globalAlpha = Math.max(b.life, 0); ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.moveTo(0, s * .8);
    ctx.bezierCurveTo(-s * 1.25, -s * .1, -s * .6, -s, 0, -s * .35);
    ctx.bezierCurveTo(s * .6, -s, s * 1.25, -s * .1, 0, s * .8);
    ctx.fill(); ctx.restore();
  }
  bursts = bursts.filter(b => b.life > 0);
}
function loop(t) { step(t); requestAnimationFrame(loop); }

/* ── 前景剪影：山丘、小镇、柏树 ── */
function paintLand() {
  const c = lctx; c.clearRect(0, 0, W, H);
  const hill = (base, amp, f, ph) => x => H * base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.7 + ph * 2) * amp * .35;
  const far = hill(.845, H * .022, .009, 1), near = hill(.9, H * .016, .006, 4);
  const fillHill = (fn, col) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) c.lineTo(x, fn(x));
    c.lineTo(W, H); c.fill();
  };
  fillHill(far, '#16296b');
  c.strokeStyle = '#3b63b8'; c.lineWidth = 2; c.lineCap = 'round';
  for (let x = 6; x < W; x += 15) { c.globalAlpha = .55; c.beginPath(); c.moveTo(x, far(x) + 5); c.lineTo(x + 8, far(x + 8) + 5); c.stroke(); }
  c.globalAlpha = 1;
  fillHill(near, '#070d26');
  // 小镇
  const hs = Math.max(9, U * .03);
  for (let x = W * .3; x < W * .97; x += hs * R(1.25, 1.9)) {
    const w = hs * R(.9, 1.4), h = hs * R(.7, 1.2), y = near(x) + 3;
    c.fillStyle = '#0a1230'; c.fillRect(x, y - h, w, h + 6);
    c.beginPath(); c.moveTo(x - 2, y - h); c.lineTo(x + w / 2, y - h - hs * .55); c.lineTo(x + w + 2, y - h); c.fill();
    if (Math.random() < .75) { c.fillStyle = Math.random() < .5 ? '#ffd95a' : '#f6a623'; c.fillRect(x + w * .3, y - h * .62, w * .26, h * .3); }
  }
  const sx = W * .62, sy = near(sx);                      // 教堂尖顶
  c.fillStyle = '#0a1230'; c.fillRect(sx - hs * .3, sy - hs * 2, hs * .6, hs * 2 + 4);
  c.beginPath(); c.moveTo(sx - hs * .36, sy - hs * 2); c.lineTo(sx, sy - hs * 4.6); c.lineTo(sx + hs * .36, sy - hs * 2); c.fill();
  // 柏树：几簇火焰状的深色笔触
  const bx = W * .1, top = H * .5, bw = Math.max(26, U * .085);
  const flame = (x, ty, w, col) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(x - w, H + 4);
    c.bezierCurveTo(x - w * 1.5, H * .86, x - w * .2, ty + (H - ty) * .42, x + w * .12, ty);
    c.bezierCurveTo(x + w * .7, ty + (H - ty) * .36, x + w * 1.5, H * .84, x + w, H + 4); c.fill();
  };
  flame(bx, top, bw, '#050d14'); flame(bx - bw * .75, H * .64, bw * .7, '#07141a'); flame(bx + bw * .85, H * .7, bw * .65, '#050d14');
  c.strokeStyle = '#1f4a3a'; c.lineWidth = 2;
  for (let i = 0; i < 26; i++) {
    const y = R(top + (H - top) * .16, H), k = (y - top) / (H - top), x = bx + R(-1, 1) * bw * k * .8;
    c.globalAlpha = .7; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + R(-8, 8), y - 12, x + R(-4, 4), y - R(18, 30)); c.stroke();
  }
  c.globalAlpha = 1;
}

/* ── 点一下，冒出小爱心 ── */
addEventListener('pointerdown', e => {
  if (reduced) return;
  for (let i = 0; i < 12; i++)
    bursts.push({ x: e.clientX, y: e.clientY, vx: R(-2.6, 2.6), vy: R(-4.5, -1), s: R(6, 13), life: 1, c: i % 2 ? '#ffd95a' : '#ffb0c4' });
});

/* ── 启动 ── */
$('names').innerHTML = `${CONFIG.names[0]}<em>&amp;</em>${CONFIG.names[1]}`;
$('since').textContent = `起始日 ${SY}-${SM}-${SD} 星期${'日一二三四五六'[new Date(SY, SM - 1, SD).getDay()]}`;
tick(); layout(); countUp();
setInterval(tick, 1000);
addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
if (!reduced) requestAnimationFrame(loop);
</script>
